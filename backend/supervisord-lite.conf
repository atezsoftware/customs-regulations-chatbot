[supervisord]
nodaemon=true
user=root
logfile=/var/log/onyx/supervisord.log
environment=PYTHONPATH="/app"

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Benchmark runs have a dedicated app and queue so this worker cannot consume
# Craft schedules or ingestion work.
[program:celery_worker_regulatory_benchmark]
user=onyx
command=celery -A onyx.background.celery.versioned_apps.regulatory_benchmark worker
    --hostname=regulatory_benchmark@%%n
    -Q regulatory_benchmark
stdout_logfile=/var/log/onyx/celery_worker_regulatory_benchmark.log
stdout_logfile_maxbytes=16MB
redirect_stderr=true
autorestart=true
startsecs=10
stopasgroup=true

# Existing indexed files still need metadata synchronization and deletion even
# though source-document parsing is disabled in this image.
[program:celery_worker_user_file_maintenance]
user=onyx
command=celery -A onyx.background.celery.versioned_apps.user_file_maintenance worker
    --hostname=user_file_maintenance@%%n
    -Q user_file_project_sync,user_file_delete
stdout_logfile=/var/log/onyx/celery_worker_user_file_maintenance.log
stdout_logfile_maxbytes=16MB
redirect_stderr=true
autorestart=true
startsecs=10
stopasgroup=true

# Lightweight metadata, permission, deletion, and cleanup tasks required by
# the running application. Bulk Elasticsearch migration stays outside production-
# lite because it can write document projections from a stale broker backlog.
[program:celery_worker_light]
user=onyx
command=celery -A onyx.background.celery.versioned_apps.light worker
    --hostname=light@%%n
    -Q vespa_metadata_sync,connector_deletion,doc_permissions_upsert,checkpoint_cleanup,index_attempt_cleanup,chat_ttl_deletion
stdout_logfile=/var/log/onyx/celery_worker_light.log
stdout_logfile_maxbytes=16MB
redirect_stderr=true
autorestart=true
startsecs=10
stopasgroup=true

[program:celery_worker_monitoring]
user=onyx
command=celery -A onyx.background.celery.versioned_apps.monitoring worker
    --hostname=monitoring@%%n
    -Q monitoring
stdout_logfile=/var/log/onyx/celery_worker_monitoring.log
stdout_logfile_maxbytes=16MB
redirect_stderr=true
autorestart=true
startsecs=10
stopasgroup=true

[program:log-redirect-handler]
user=onyx
command=tail -qF
    /var/log/onyx/celery_worker_regulatory_benchmark.log
    /var/log/onyx/celery_worker_user_file_maintenance.log
    /var/log/onyx/celery_worker_light.log
    /var/log/onyx/celery_worker_monitoring.log
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
autorestart=true

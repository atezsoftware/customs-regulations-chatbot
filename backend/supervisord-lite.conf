[supervisord]
nodaemon=true
user=root
logfile=/var/log/onyx/supervisord.log
environment=PYTHONPATH="/app"

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770
chown=1001:1001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Regulatory LLM jobs share a low-concurrency app and isolated queues so this
# worker cannot consume Craft schedules or ingestion work.
[program:celery_worker_regulatory_benchmark]
user=onyx
command=celery -A onyx.background.celery.versioned_apps.regulatory_benchmark worker
    --hostname=regulatory_benchmark@%%n
    -Q regulatory_benchmark,regulatory_amendment
stdout_logfile=/var/log/onyx/celery_worker_regulatory_benchmark.log
stdout_logfile_maxbytes=16MB
redirect_stderr=true
autorestart=true
startsecs=10
stopasgroup=true

# Indexes uploaded user files and keeps existing ones synchronized. Markdown is
# read as plain text, so this worker runs here despite the image shipping no
# source-document parsers -- deployments that accept markdown uploads (see
# MARKDOWN_IMPORT_ENABLED) need it, and without it those uploads would sit in
# PROCESSING forever because nothing consumes the queue. It idles where uploads
# are refused. Queues match the full image so no queue has two consumers.
[program:celery_worker_user_file_processing]
user=onyx
command=celery -A onyx.background.celery.versioned_apps.user_file_processing worker
    --hostname=user_file_processing@%%n
    -Q user_file_processing,user_file_project_sync,user_file_delete,user_file_port
stdout_logfile=/var/log/onyx/celery_worker_user_file_processing.log
stdout_logfile_maxbytes=16MB
redirect_stderr=true
autorestart=true
startsecs=10
stopasgroup=true

# Durable regulatory indexing consumes only database-backed orchestration
# deliveries. The production user-file worker remains the sole owner of upload,
# explicit-index, synchronization, deletion, and port queues.
[program:celery_worker_regulatory_indexing]
user=onyx
command=celery -A onyx.background.celery.versioned_apps.regulatory_indexing worker
    --hostname=regulatory_indexing@%%n
    -Q regulatory_indexing
stdout_logfile=/var/log/onyx/celery_worker_regulatory_indexing.log
stdout_logfile_maxbytes=16MB
redirect_stderr=true
autorestart=true
startsecs=10
stopasgroup=true

# Lightweight metadata, permission, deletion, and cleanup tasks required by
# the running application. Bulk Elasticsearch migration stays outside production-
# lite because it can write document projections from a stale broker backlog.
# Re-queues user files whose per-file task expired before a worker reached it,
# which a bulk upload makes routine: every file is enqueued at once with a short
# expiry, and without this loop the surplus is discarded and those files sit in
# PROCESSING forever. BEAT_TASK_ALLOWLIST keeps the schedule to work this image
# can actually run.
[program:celery_beat]
user=onyx
command=celery -A onyx.background.celery.versioned_apps.beat beat
    --schedule=/app/beat-state/celerybeat-schedule
stdout_logfile=/var/log/onyx/celery_beat.log
stdout_logfile_maxbytes=16MB
redirect_stderr=true
autorestart=true
startsecs=10
stopasgroup=true

[program:celery_worker_light]
user=onyx
command=celery -A onyx.background.celery.versioned_apps.light worker
    --hostname=light@%%n
    -Q vespa_metadata_sync,connector_deletion,doc_permissions_upsert,checkpoint_cleanup,index_attempt_cleanup,chat_ttl_deletion
stdout_logfile=/var/log/onyx/celery_worker_light.log
stdout_logfile_maxbytes=16MB
redirect_stderr=true
autorestart=true
startsecs=10
stopasgroup=true

[program:celery_worker_monitoring]
user=onyx
command=celery -A onyx.background.celery.versioned_apps.monitoring worker
    --hostname=monitoring@%%n
    -Q monitoring
stdout_logfile=/var/log/onyx/celery_worker_monitoring.log
stdout_logfile_maxbytes=16MB
redirect_stderr=true
autorestart=true
startsecs=10
stopasgroup=true

# Production-lite runs a separate persistent Beat so durable recovery and queue
# metrics continue without enabling the generic full-runtime periodic schedule.
[program:celery_beat_regulatory_indexing]
user=onyx
command=celery -A onyx.background.celery.versioned_apps.regulatory_indexing_beat beat
    --schedule=/tmp/regulatory-indexing-beat-schedule
    --pidfile=/tmp/celery_regulatory_indexing_beat.pid
stdout_logfile=/var/log/onyx/celery_beat_regulatory_indexing.log
stdout_logfile_maxbytes=16MB
redirect_stderr=true
autorestart=true
startsecs=10
stopasgroup=true

[program:log-redirect-handler]
user=onyx
command=tail -qF
    /var/log/onyx/celery_worker_regulatory_benchmark.log
    /var/log/onyx/celery_worker_user_file_processing.log
    /var/log/onyx/celery_beat.log
    /var/log/onyx/celery_worker_regulatory_indexing.log
    /var/log/onyx/celery_worker_light.log
    /var/log/onyx/celery_worker_monitoring.log
    /var/log/onyx/celery_beat_regulatory_indexing.log
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
autorestart=true

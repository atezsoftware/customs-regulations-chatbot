apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.envConfigMapName }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
data:
  {{- $craftEnabled := eq (include "onyx.craftEnabled" .) "true" }}
  INTERNAL_URL: "http://{{ include "onyx.fullname" . }}-api-service:{{ .Values.api.service.servicePort | default 8080 }}"
  {{- if .Values.postgresql.enabled }}
  POSTGRES_HOST: {{ .Release.Name }}-pg-rw
  {{- end }}
  {{- if .Values.elasticsearch.enabled }}
  ELASTICSEARCH_HOST: {{ .Values.elasticsearch.host | quote }}
  ELASTICSEARCH_REST_API_PORT: {{ .Values.elasticsearch.port | quote }}
  ELASTICSEARCH_USE_SSL: {{ .Values.elasticsearch.useSsl | quote }}
  ELASTICSEARCH_VERIFY_CERTS: {{ .Values.elasticsearch.verifyCerts | quote }}
  {{- with .Values.elasticsearch.caCerts }}
  ELASTICSEARCH_CA_CERTS: {{ . | quote }}
  {{- end }}
  ELASTICSEARCH_ADMIN_USERNAME: {{ .Values.elasticsearch.adminUsername | quote }}
  ENABLE_ELASTICSEARCH_INDEXING_FOR_ONYX: "true"
  ENABLE_ELASTICSEARCH_RETRIEVAL_FOR_ONYX: "false"
  {{- end }}
  {{- if .Values.redis.enabled }}
  # Standalone Redis CR produces a Service named after the CR (no `-master`
  # suffix — that suffix is only for RedisReplication CRs).
  REDIS_HOST: {{ .Values.redis.redisStandalone.name | default .Release.Name }}
  {{- end }}
  {{- /* configMap overrides win (rendered by the range below) — emitting the
  default too would produce a duplicate YAML key. */}}
  {{- if and (gt (int .Values.inferenceCapability.replicaCount) 0) (not (index .Values.configMap "MODEL_SERVER_HOST")) }}
  MODEL_SERVER_HOST: "{{ include "onyx.fullname" . }}-inference-model-service"
  {{- end }}
  {{- if .Values.vectorDB.enabled }}
  {{- if gt (int .Values.indexCapability.replicaCount) 0 }}
  {{- if not (index .Values.configMap "INDEXING_MODEL_SERVER_HOST") }}
  INDEXING_MODEL_SERVER_HOST: "{{ include "onyx.fullname" . }}-indexing-model-service"
  {{- end }}
  {{- end }}
  DISABLE_VECTOR_DB: "false"
  {{- else }}
  DISABLE_VECTOR_DB: "true"
  {{- end }}
{{- range $key, $value := .Values.configMap }}
{{- $skipCraftProxyKey := and $craftEnabled (or (eq $key "SANDBOX_PROXY_HOST") (eq $key "SANDBOX_PROXY_PORT")) }}
{{- if and (not (empty $value)) (not $skipCraftProxyKey) }}
  {{ $key }}: "{{ $value }}"
{{- end }}
{{- end }}
  {{- if .Values.minio.enabled }}
  S3_ENDPOINT_URL: "http://{{ .Release.Name }}-minio:{{ default 9000 .Values.minio.service.port }}"
  {{- end }}
  {{- if .Values.codeInterpreter.enabled }}
  CODE_INTERPRETER_BASE_URL: "http://{{ .Release.Name }}-code-interpreter:{{ .Values.codeInterpreter.service.port }}"
  {{- end }}
  {{- if $craftEnabled }}
  SANDBOX_PROXY_HOST: "{{ include "onyx.sandboxProxyHost" . }}"
  SANDBOX_PROXY_PORT: "{{ include "onyx.sandboxProxyPort" . }}"
  {{- end }}

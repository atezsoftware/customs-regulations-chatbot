# Regulatory production-lite overlay.
#
# Apply this after docker-compose.yml or docker-compose.prod.yml. It replaces
# only the backend runtime image and source-document ingestion capability. The
# base compose file remains responsible for PostgreSQL, Elasticsearch, Redis,
# object storage, model servers, web, and nginx. The profile-gated job below is
# the only migration owner.

services:
  api_server:
    # Production consumes a published, immutable image. `!reset` removes the
    # build definition inherited from the base compose file.
    image: ${ONYX_BACKEND_LITE_IMAGE:?set ONYX_BACKEND_LITE_IMAGE to the published runtime-lite image by digest}
    build: !reset null
    pull_policy: always
    user: "1001:1001"
    # The canonical deploy wrapper owns the singleton migration. Startup and
    # rollback must never run Alembic implicitly.
    command:
      - uvicorn
      - onyx.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      DOCUMENT_IMPORT_ENABLED: "false"
      MARKDOWN_IMPORT_ENABLED: ${MARKDOWN_IMPORT_ENABLED:-true}
      MAX_ARCHIVE_COMPRESSION_RATIO: ${MAX_ARCHIVE_COMPRESSION_RATIO:-100}
      MAX_ARCHIVE_ENTRIES: ${MAX_ARCHIVE_ENTRIES:-500}
      MAX_ARCHIVE_EXPANDED_BYTES: ${MAX_ARCHIVE_EXPANDED_BYTES:-536870912}
      REGULATORY_BATCH_INDEXING_ENABLED: ${REGULATORY_BATCH_INDEXING_ENABLED:-false}
      DISABLE_ONYX_UPSTREAM_CONNECTIONS: "true"
      DISABLE_TELEMETRY: "true"
      ENABLE_CRAFT: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "true"
      LICENSE_ENFORCEMENT_ENABLED: "false"
      # Make the runtime/migration database target explicit in the rendered
      # model so preflight can prove that only their credentials differ.
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

  background:
    image: ${ONYX_BACKEND_LITE_IMAGE:?set ONYX_BACKEND_LITE_IMAGE to the published runtime-lite image by digest}
    build: !reset null
    pull_policy: always
    # Supervisor stays root solely to prepare the mounted log directory and
    # drop each managed process to `onyx`. Only flat, known log files are
    # touched so an old volume cannot trigger an unbounded recursive chown.
    command:
      - /bin/sh
      - -ec
      - |
        if [ -f /etc/ssl/certs/custom-ca.crt ]; then update-ca-certificates; fi
        chown onyx:onyx /var/log/onyx
        for log_file in /var/log/onyx/*.log; do
          [ ! -e "$$log_file" ] || chown onyx:onyx "$$log_file"
        done
        exec /app/scripts/supervisord_entrypoint.sh
    depends_on:
      # Markdown durable indexing uses cloud providers and never needs the
      # heavyweight indexing model server. Remove the inherited dependency so
      # it cannot be activated through the base Compose graph.
      indexing_model_server: !reset null
    environment:
      DOCUMENT_IMPORT_ENABLED: "false"
      MARKDOWN_IMPORT_ENABLED: ${MARKDOWN_IMPORT_ENABLED:-true}
      REGULATORY_BATCH_INDEXING_ENABLED: ${REGULATORY_BATCH_INDEXING_ENABLED:-false}
      REGULATORY_INDEXING_EMBEDDING_REQUEST_SIZE: ${REGULATORY_INDEXING_EMBEDDING_REQUEST_SIZE:-64}
      REGULATORY_INDEXING_GCS_URI: ${REGULATORY_INDEXING_GCS_URI:-}
      REGULATORY_INDEXING_LEASE_SECONDS: ${REGULATORY_INDEXING_LEASE_SECONDS:-120}
      REGULATORY_INDEXING_MAX_ATTEMPTS: ${REGULATORY_INDEXING_MAX_ATTEMPTS:-5}
      REGULATORY_INDEXING_POLL_SECONDS: ${REGULATORY_INDEXING_POLL_SECONDS:-30}
      REGULATORY_INDEXING_RETRY_BASE_SECONDS: ${REGULATORY_INDEXING_RETRY_BASE_SECONDS:-15}
      REGULATORY_INDEXING_RETRY_MAX_SECONDS: ${REGULATORY_INDEXING_RETRY_MAX_SECONDS:-900}
      DISABLE_ONYX_UPSTREAM_CONNECTIONS: "true"
      DISABLE_TELEMETRY: "true"
      ENABLE_CRAFT: "false"
      ENABLE_PAID_ENTERPRISE_EDITION_FEATURES: "true"
      LICENSE_ENFORCEMENT_ENABLED: "false"
      # This lite supervisor intentionally has no primary Celery worker.
      CELERY_PRIMARY_WORKER_REQUIRED: "false"
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import subprocess
          from onyx.background.celery.regulatory_indexing_beat_health import validate_regulatory_indexing_beat
          result = subprocess.run(["supervisorctl", "status"], capture_output=True, text=True)
          rows = [line.split() for line in result.stdout.splitlines() if line.split()]
          expected = {"celery_worker_regulatory_benchmark", "celery_beat", "celery_worker_user_file_processing", "celery_worker_regulatory_indexing", "celery_worker_light", "celery_worker_monitoring", "celery_beat_regulatory_indexing", "log-redirect-handler"}
          assert result.returncode == 0 and {row[0] for row in rows} == expected and all(len(row) > 1 and row[1] == "RUNNING" for row in rows)
          validate_regulatory_indexing_beat(result.stdout)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web_server:
    image: ${ONYX_WEB_SERVER_IMAGE:?set ONYX_WEB_SERVER_IMAGE to the matching published web image by digest}
    build: !reset null
    pull_policy: always
    # The base file loads the full application environment. The web proxy only
    # receives its small, non-secret runtime configuration.
    env_file: !override
      - path: .env.web
        required: true
    environment:
      DISABLE_ONYX_UPSTREAM_CONNECTIONS: "true"
      NEXT_PUBLIC_DISABLE_ONYX_UPSTREAM_CONNECTIONS: "true"

  # The base Compose cache is intentionally ephemeral. Regulatory benchmark
  # and maintenance jobs need broker messages to survive a container restart,
  # so Compose-managed Redis uses an AOF-backed named volume here.
  cache:
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    tmpfs: !reset []
    volumes:
      - regulatory_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  code-interpreter:
    profiles: ["code-interpreter"]

  inference_model_server:
    # Cloud mode parks this service before Compose evaluates the active graph.
    # The non-pullable fallback lets a cloud-only release omit the CUDA-backed
    # artifact entirely; local mode must override it with a reviewed digest.
    image: ${ONYX_MODEL_SERVER_IMAGE:-registry.invalid/regulatory-model-server:cloud-disabled}
    build: !reset null
    pull_policy: always

  # Local inference remains part of the default search/chat stack. The
  # indexing-only model server is needed solely by an explicitly enabled
  # indexing deployment, never by parser-free production.
  indexing_model_server:
    image: ${ONYX_MODEL_SERVER_IMAGE:-registry.invalid/regulatory-model-server:cloud-disabled}
    build: !reset null
    pull_policy: always
    profiles: ["indexing-model-server"]

  # Schema changes are owned by a single, explicitly invoked job. The common
  # environment supplies topology/provider configuration; the second file
  # replaces only the database identity with the dedicated migration role.
  regulatory_migration:
    image: ${ONYX_BACKEND_LITE_IMAGE:?set ONYX_BACKEND_LITE_IMAGE to the published runtime-lite image by digest}
    build: !reset null
    pull_policy: always
    user: "1001:1001"
    profiles: ["regulatory-migration"]
    env_file:
      - path: .env
        required: true
      - path: .env.migration
        required: true
    environment:
      DOCUMENT_IMPORT_ENABLED: "false"
      MULTI_TENANT: ${MULTI_TENANT:-false}
      POSTGRES_HOST: ${POSTGRES_HOST:-relational_db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    command:
      - alembic
      - upgrade
      - head
    restart: "no"

volumes:
  regulatory_cache_data:

# Optional overlay for regulatory deployments that use externally managed
# PostgreSQL, Elasticsearch, Redis, and object storage. Apply it after the base
# production file and before docker-compose.regulatory-prod-lite.yml.
#
# Merely changing *_HOST variables is not enough: the base Compose model would
# still start its local infrastructure services. This overlay removes those
# dependencies and parks the local services behind an explicit opt-in profile.

services:
  api_server:
    depends_on:
      relational_db: !reset null
      elasticsearch: !reset null
      cache: !reset null
      minio: !reset null

  background:
    depends_on:
      relational_db: !reset null
      elasticsearch: !reset null
      cache: !reset null

  relational_db:
    profiles: ["local-infra"]

  elasticsearch:
    profiles: ["local-infra"]

  cache:
    profiles: ["local-infra"]

  minio:
    profiles: ["local-infra"]

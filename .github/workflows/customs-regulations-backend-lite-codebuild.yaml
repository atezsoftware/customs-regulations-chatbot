name: Customs Regulations Backend Lite EKS Build And Deploy
run-name: Deployment triggered for branch ${{ github.ref }} by @${{ github.actor }} with commit ${{ github.sha }} - ${{ github.event.head_commit.message }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment'
        required: false
        default: dev
        type: choice
        options:
          - dev
          - test
          - production
      action:
        description: 'Select the action'
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - redeploy
      image_tag:
        description: 'Enter the image tag'
        required: false
        default: ''
  push:
    branches:
      - develop
      - test/v1
      - release/v1
    paths:
      - "backend/**"
      - ".dockerignore"
      - ".github/workflows/customs-regulations-backend-lite-codebuild.yaml"

jobs:
  build-and-deploy:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      id-token: write
      issues: write
      contents: read
      packages: write
      checks: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Creating Environment Variables
        env:
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_GIT_REF: ${{ github.ref }}
          WORKFLOW_GIT_SHA: ${{ github.sha }}
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
          DISPATCH_ACTION: ${{ inputs.action }}
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "$WORKFLOW_EVENT_NAME" == "workflow_dispatch" ]]; then
            deployment_target="$DISPATCH_ENVIRONMENT"
          elif [[ "$WORKFLOW_EVENT_NAME" == "push" ]]; then
            case "$WORKFLOW_GIT_REF" in
              refs/heads/develop) deployment_target="dev" ;;
              refs/heads/test/v1) deployment_target="test" ;;
              refs/heads/release/v1) deployment_target="production" ;;
              *)
                echo "Unsupported deployment ref: $WORKFLOW_GIT_REF" >&2
                exit 1
                ;;
            esac
          else
            echo "Unsupported deployment event: $WORKFLOW_EVENT_NAME" >&2
            exit 1
          fi

          case "$deployment_target" in
          dev)
            echo "SERVICE_NAME=customs-regulations-backend-lite-dev" >> $GITHUB_ENV
            echo "DOCKER_IMAGE_REPO=255114580789.dkr.ecr.eu-central-1.amazonaws.com/customs-regulations-backend-lite-dev" >> $GITHUB_ENV
            echo "env_x=dev" >> $GITHUB_ENV
            echo "space_x=dev" >> $GITHUB_ENV
            echo "namespace=customs-regulations-dev" >> $GITHUB_ENV
            echo "CLUSTER_NAME=atez-dev-cluster" >> $GITHUB_ENV
            ;;
          test)
            echo "SERVICE_NAME=customs-regulations-backend-lite-test-v1" >> $GITHUB_ENV
            echo "DOCKER_IMAGE_REPO=255114580789.dkr.ecr.eu-central-1.amazonaws.com/customs-regulations-backend-lite-test-v1" >> $GITHUB_ENV
            echo "env_x=test-v1" >> $GITHUB_ENV
            echo "space_x=test-v1" >> $GITHUB_ENV
            echo "namespace=customs-regulations-test" >> $GITHUB_ENV
            echo "CLUSTER_NAME=atez-dev-cluster" >> $GITHUB_ENV
            ;;
          production)
            echo "SERVICE_NAME=customs-regulations-backend-lite-v1" >> $GITHUB_ENV
            echo "DOCKER_IMAGE_REPO=255114580789.dkr.ecr.eu-central-1.amazonaws.com/customs-regulations-backend-lite-v1" >> $GITHUB_ENV
            echo "env_x=v1" >> $GITHUB_ENV
            echo "space_x=prod" >> $GITHUB_ENV
            echo "namespace=customs-regulations-prod" >> $GITHUB_ENV
            echo "CLUSTER_NAME=atez-prod-cluster" >> $GITHUB_ENV
            ;;
          *)
            echo "Unsupported deployment target: $deployment_target" >&2
            exit 1
            ;;
          esac

          echo "GIT_COMMIT=$WORKFLOW_GIT_SHA" >> $GITHUB_ENV
          echo "AWS_REGION=eu-central-1" >> $GITHUB_ENV
          echo "AWS_ECR=255114580789.dkr.ecr.eu-central-1.amazonaws.com" >> $GITHUB_ENV
          if [[ "$DISPATCH_ACTION" == "redeploy" ]]; then
            echo "IMAGE_TAG=$DISPATCH_IMAGE_TAG" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=$WORKFLOW_GIT_SHA" >> $GITHUB_ENV
          fi

      - name: Validate Redeploy Image
        if: inputs.action == 'redeploy'
        env:
          REDEPLOY_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -z "${REDEPLOY_IMAGE_TAG//[[:space:]]/}" ]]; then
            echo "Error: image_tag input is required for redeploy action." >&2
            exit 1
          fi
          echo "Using image tag for redeploy: $REDEPLOY_IMAGE_TAG"

      - name: AWS ECR login
        if: inputs.action != 'redeploy'
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ECR }}

      - name: Docker Build ve Tag
        if: inputs.action != 'redeploy'
        run: |
          docker build backend \
            -t ${{ env.SERVICE_NAME }}:${{ env.GIT_COMMIT }} \
            -f backend/Dockerfile.runtime-lite \
            --target runtime-lite \
            --network host \
            --build-arg "ONYX_VERSION=${{ env.GIT_COMMIT }}" \
            --build-arg "SOURCE_REVISION=${{ env.GIT_COMMIT }}"
          docker tag ${{ env.SERVICE_NAME }}:${{ env.GIT_COMMIT }} ${{ env.DOCKER_IMAGE_REPO }}:${{ env.GIT_COMMIT }}
          docker tag ${{ env.SERVICE_NAME }}:${{ env.GIT_COMMIT }} ${{ env.DOCKER_IMAGE_REPO }}:latest
          echo "IMAGE_TAG=${{ env.GIT_COMMIT }}" >> $GITHUB_ENV

      - name: Docker Push
        if: inputs.action != 'redeploy'
        run: |
          docker push ${{ env.DOCKER_IMAGE_REPO }}:${{ env.GIT_COMMIT }}
          docker push ${{ env.DOCKER_IMAGE_REPO }}:latest

      - name: Checkout Helm Charts from DevOps Repository
        uses: actions/checkout@v5
        with:
          repository: 'atezsoftware/devops'
          token: ${{ secrets.DEVOPS_TOKEN }}
          path: 'devops'

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Capture pre-deploy worker diagnostics
        run: |
          set -euo pipefail

          selector="app=${env_x}-customs-regulations-background"
          pods=$(kubectl get pods --namespace "${namespace}" -l "$selector" -o json)
          pod=$(jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .metadata.name' <<<"$pods" | head -n 1)
          if [[ -z "$pod" ]]; then
            echo "No active background pod found"
            exit 0
          fi

          echo "Background pod runtime state"
          jq -r --arg pod "$pod" '
            .items[]
            | select(.metadata.name == $pod)
            | {
                name: .metadata.name,
                phase: .status.phase,
                started_at: .status.startTime,
                containers: [
                  .status.containerStatuses[]?
                  | {
                      name,
                      ready,
                      restart_count: .restartCount,
                      state,
                      last_state: .lastState
                    }
                ]
              }
          ' <<<"$pods"

          container=$(kubectl get pod "$pod" --namespace "${namespace}" -o json | jq -r '.spec.containers[0].name')

          echo "Benchmark worker supervisor state"
          kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- \
            supervisorctl -c /etc/supervisor/conf.d/supervisord.conf \
            status celery_worker_regulatory_benchmark || true

          echo "Regulatory indexing worker supervisor state"
          kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- \
            supervisorctl -c /etc/supervisor/conf.d/supervisord.conf \
            status celery_worker_regulatory_indexing || true

          echo "Regulatory indexing Beat supervisor state"
          kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- \
            supervisorctl -c /etc/supervisor/conf.d/supervisord.conf \
            status celery_beat_regulatory_indexing || true

          echo "Amendment worker Celery task state"
          for state in active reserved scheduled registered; do
            echo "celery inspect ${state}"
            kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- \
              timeout 10s celery \
                -A onyx.background.celery.apps.regulatory_benchmark:celery_app \
                inspect "$state" --timeout=5 || true
          done

          echo "API/background Celery broker and amendment queue state"
          for component in api background; do
            component_selector="app=${env_x}-customs-regulations-${component}"
            component_pod=$(kubectl get pods --namespace "${namespace}" -l "$component_selector" -o json \
              | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .metadata.name' \
              | head -n 1)
            if [[ -z "$component_pod" ]]; then
              echo "${component}: no active pod"
              continue
            fi
            component_container=$(kubectl get pod "$component_pod" --namespace "${namespace}" -o json \
              | jq -r '.spec.containers[0].name')
            echo "${component}: pod=${component_pod}"
            kubectl exec -i "$component_pod" --namespace "${namespace}" -c "$component_container" -- \
              timeout 60s python - <<'PY' || true
          import base64
          import hashlib
          import json

          from onyx.background.celery.celery_redis import celery_get_broker_client
          from onyx.background.celery.versioned_apps.client import app
          from onyx.configs.constants import OnyxCeleryPriority, OnyxCeleryQueues

          broker_url = str(app.conf.broker_url)
          print("broker_fingerprint=" + hashlib.sha256(broker_url.encode()).hexdigest()[:16])
          redis_client = celery_get_broker_client(app)
          queue = str(OnyxCeleryQueues.REGULATORY_AMENDMENT)
          for priority in range(len(OnyxCeleryPriority)):
              queue_name = queue if priority == 0 else f"{queue}:{priority}"
              messages = redis_client.lrange(queue_name, 0, -1)
              print(f"queue={queue_name} length={len(messages)}")
              for raw_message in messages:
                  message = json.loads(raw_message)
                  headers = message.get("headers", {})
                  body = json.loads(base64.b64decode(message["body"]))
                  kwargs = body[1] if len(body) > 1 and isinstance(body[1], dict) else {}
                  print(
                      "queued_task=%s id=%s proposal_id=%s batch_id=%s"
                      % (
                          headers.get("task"),
                          headers.get("id"),
                          kwargs.get("proposal_id"),
                          kwargs.get("batch_id"),
                      )
                  )
          print("unacked_length=%s" % redis_client.hlen("unacked"))
          PY
          done

          echo "Container memory counters"
          kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- \
            sh -c 'for file in memory.current memory.peak memory.max memory.events; do if [ -r "/sys/fs/cgroup/$file" ]; then printf "%s=" "$file"; tr "\n" "," < "/sys/fs/cgroup/$file"; printf "\n"; fi; done' || true

          echo "Filtered regulatory worker runtime logs"
          kubectl logs "$pod" --namespace "${namespace}" -c "$container" --tail=5000 \
            | grep -E -i 'amendment|benchmark|regulatory.?index|unregistered|unknown task|not registered|oom|out of memory|memoryerror|sigkill|killed|worker lost|terminated by' \
            | tail -n 800 || true

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v4.2.3

      - name: Deploy api and background with Helm
        id: helm_deploy
        run: |
          deploy_app() {
            local app_name="$1"
            local values_file="$2"
            local wait_for_ready="$3"
            local memory_limit="$4"
            local release="${app_name}-${env_x}"
            local deployment="${env_x}-${app_name}-deployment"
            local selector="app=${env_x}-${app_name}"
            local -a memory_override=()

            if [[ -n "$memory_limit" ]]; then
              memory_override+=(--set "app.mem_limits=$memory_limit")
            fi

            if ! kubectl get namespace "${namespace}" >/dev/null 2>&1; then
              echo "Namespace ${namespace} does not exist yet; skipping terminating pod cleanup for ${app_name}."
            else
              terminating_pods=$(kubectl get pods --namespace "${namespace}" -l "$selector" -o json | jq -r '.items[] | select(.metadata.deletionTimestamp != null) | .metadata.name')
              if [[ -n "$terminating_pods" ]]; then
                echo "$terminating_pods" | while read -r pod; do
                  echo "Force deleting terminating pod: $pod"
                  kubectl delete pod "$pod" --namespace "${namespace}" --grace-period=0 --force || true
                done
              fi
            fi

            if status_json=$(helm status "$release" --namespace "${namespace}" -o json 2>/dev/null); then
              release_status=$(jq -r '.info.status // empty' <<<"$status_json")
              if [[ "$release_status" == pending-* ]]; then
                echo "Release $release is $release_status; recovering the last successful revision."
                history_json=$(helm history "$release" --namespace "${namespace}" -o json)
                rollback_revision=$(jq -r '[.[] | select(.status == "deployed" or .status == "superseded")] | sort_by(.revision | tonumber) | last | .revision // empty' <<<"$history_json")
                if [[ -n "$rollback_revision" ]]; then
                  helm rollback "$release" "$rollback_revision" \
                    --namespace "${namespace}" \
                    --server-side=false \
                    --wait=watcher \
                    --timeout 600s
                else
                  helm uninstall "$release" --namespace "${namespace}" || true
                fi
              fi
            fi

            helm upgrade --install "$release" \
              -f "./devops/${space_x}/${values_file}" \
              --namespace "${namespace}" \
              --create-namespace \
              --server-side=false \
              --set image.tag="${IMAGE_TAG}" \
              "${memory_override[@]}" \
              ./devops \
              --timeout 600s

            kubectl rollout status deployment "$deployment" \
              --namespace "${namespace}" --timeout=600s

            echo "Waiting for deployment $deployment to use image tag ${IMAGE_TAG}"
            for attempt in {1..60}; do
              if kubectl get deployment "$deployment" --namespace "${namespace}" -o json | jq -e --arg tag "${IMAGE_TAG}" 'any(.spec.template.spec.containers[]?; (.image | endswith(":" + $tag)))' >/dev/null; then
                break
              fi
              sleep 5
            done

            kubectl get deployment "$deployment" --namespace "${namespace}" -o json | jq -e --arg tag "${IMAGE_TAG}" 'any(.spec.template.spec.containers[]?; (.image | endswith(":" + $tag)))' >/dev/null

            if [[ "$wait_for_ready" == "true" ]]; then
              echo "Waiting for a Ready pod running image tag ${IMAGE_TAG} for ${app_name}"
              for attempt in {1..120}; do
                ready_pods=$(kubectl get pods --namespace "${namespace}" -l "$selector" -o json | jq -r --arg tag "${IMAGE_TAG}" '.items[] | select(.metadata.deletionTimestamp == null) | select(any(.spec.containers[]?; (.image | endswith(":" + $tag)))) | select(any(.status.conditions[]?; .type == "Ready" and .status == "True")) | .metadata.name')
                if [[ -n "$ready_pods" ]]; then
                  echo "Ready pod(s) for ${app_name}:"
                  echo "$ready_pods"
                  return 0
                fi
                sleep 5
              done
              echo "No Ready pod found for ${app_name} image tag ${IMAGE_TAG}" >&2
              return 1
            fi

            echo "Skipping Ready wait for ${app_name} (no HTTP probe)"
            return 0
          }

          verify_benchmark_worker() {
            local app_name="customs-regulations-background"
            local selector="app=${env_x}-${app_name}"
            local pod
            local container
            local worker_status
            local readiness_file="/tmp/onyx_k8s_regulatorybenchmark_readiness.txt"

            echo "Waiting for the dedicated benchmark worker to become Celery-ready"
            for attempt in {1..60}; do
              pod=$(kubectl get pods --namespace "${namespace}" -l "$selector" -o json | jq -r --arg tag "${IMAGE_TAG}" '.items[] | select(.metadata.deletionTimestamp == null) | select(any(.spec.containers[]?; (.image | endswith(":" + $tag)))) | select(any(.status.conditions[]?; .type == "Ready" and .status == "True")) | .metadata.name' | head -n 1)
              if [[ -n "$pod" ]]; then
                container=$(kubectl get pod "$pod" --namespace "${namespace}" -o json | jq -r --arg tag "${IMAGE_TAG}" '.spec.containers[] | select(.image | endswith(":" + $tag)) | .name' | head -n 1)
                if [[ -n "$container" ]]; then
                  worker_status=$(kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status celery_worker_regulatory_benchmark 2>&1 || true)
                  echo "$worker_status"
                  if grep -q "RUNNING" <<<"$worker_status" && \
                    kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- \
                      test -f "$readiness_file"; then
                    echo "Dedicated benchmark worker is Celery-ready in pod $pod"
                    return 0
                  fi
                fi
              fi
              sleep 5
            done

            echo "Dedicated benchmark worker did not become Celery-ready for image tag ${IMAGE_TAG}" >&2
            return 1
          }

          verify_regulatory_indexing_worker() {
            local app_name="customs-regulations-background"
            local selector="app=${env_x}-${app_name}"
            local pod
            local container
            local worker_status
            local readiness_file="/tmp/onyx_k8s_regulatoryindexing_readiness.txt"

            echo "Waiting for the dedicated regulatory indexing worker to become Celery-ready"
            for attempt in {1..60}; do
              pod=$(kubectl get pods --namespace "${namespace}" -l "$selector" -o json | jq -r --arg tag "${IMAGE_TAG}" '.items[] | select(.metadata.deletionTimestamp == null) | select(any(.spec.containers[]?; (.image | endswith(":" + $tag)))) | select(any(.status.conditions[]?; .type == "Ready" and .status == "True")) | .metadata.name' | head -n 1)
              if [[ -n "$pod" ]]; then
                container=$(kubectl get pod "$pod" --namespace "${namespace}" -o json | jq -r --arg tag "${IMAGE_TAG}" '.spec.containers[] | select(.image | endswith(":" + $tag)) | .name' | head -n 1)
                if [[ -n "$container" ]]; then
                  worker_status=$(kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status celery_worker_regulatory_indexing 2>&1 || true)
                  echo "$worker_status"
                  if grep -Eq '^celery_worker_regulatory_indexing[[:space:]]+RUNNING([[:space:]]|$)' <<<"$worker_status" && \
                    kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- \
                      test -f "$readiness_file"; then
                    echo "Dedicated regulatory indexing worker is Celery-ready in pod $pod"
                    return 0
                  fi
                fi
              fi
              sleep 5
            done

            echo "Dedicated regulatory indexing worker did not become Celery-ready for image tag ${IMAGE_TAG}" >&2
            return 1
          }

          verify_regulatory_indexing_beat() {
            local app_name="customs-regulations-background"
            local selector="app=${env_x}-${app_name}"
            local pod_json
            local pod_names
            local pod
            local container_json
            local container_names
            local container
            local beat_status
            local all_replicas_ready
            local -a pods=()
            local -a containers=()

            echo "Waiting for every Ready production-lite regulatory indexing Beat replica"
            for attempt in {1..60}; do
              if ! pod_json=$(kubectl get pods --namespace "${namespace}" -l "$selector" -o json); then
                sleep 5
                continue
              fi
              if ! pod_names=$(jq -r --arg tag "${IMAGE_TAG}" '.items[] | select(.metadata.deletionTimestamp == null) | select(any(.spec.containers[]?; (.image | endswith(":" + $tag)))) | select(any(.status.conditions[]?; .type == "Ready" and .status == "True")) | .metadata.name' <<<"$pod_json"); then
                sleep 5
                continue
              fi
              pods=()
              if [[ -n "$pod_names" ]]; then
                mapfile -t pods <<<"$pod_names"
              fi
              if (( ${#pods[@]} > 0 )); then
                all_replicas_ready=true
                for pod in "${pods[@]}"; do
                  if ! container_json=$(kubectl get pod "$pod" --namespace "${namespace}" -o json); then
                    all_replicas_ready=false
                    continue
                  fi
                  if ! container_names=$(jq -r --arg tag "${IMAGE_TAG}" '.spec.containers[] | select(.image | endswith(":" + $tag)) | .name' <<<"$container_json"); then
                    all_replicas_ready=false
                    continue
                  fi
                  containers=()
                  if [[ -n "$container_names" ]]; then
                    mapfile -t containers <<<"$container_names"
                  fi
                  if (( ${#containers[@]} != 1 )); then
                    echo "Expected one ${IMAGE_TAG} container in pod $pod; found ${#containers[@]}" >&2
                    all_replicas_ready=false
                    continue
                  fi
                  container="${containers[0]}"
                  if ! beat_status=$(kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status celery_beat_regulatory_indexing 2>&1); then
                    echo "$beat_status"
                    all_replicas_ready=false
                    continue
                  fi
                  echo "$beat_status"
                  if ! grep -Eq '^celery_beat_regulatory_indexing[[:space:]]+RUNNING([[:space:]]|$)' <<<"$beat_status"; then
                    all_replicas_ready=false
                    continue
                  fi
                  if ! kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- \
                    python -m onyx.background.celery.regulatory_indexing_beat_health; then
                    all_replicas_ready=false
                    continue
                  fi
                  echo "Production-lite regulatory indexing Beat is ready in pod $pod"
                done
                if [[ "$all_replicas_ready" == "true" ]]; then
                  echo "Validated ${#pods[@]} Ready production-lite Beat replica(s) for ${IMAGE_TAG}"
                  return 0
                fi
              fi
              sleep 5
            done

            echo "Not every Ready production-lite regulatory indexing Beat replica passed probes for image tag ${IMAGE_TAG}" >&2
            return 1
          }

          capture_background_memory_evidence() {
            local app_name="customs-regulations-background"
            local selector="app=${env_x}-${app_name}"
            local pod
            local container

            pod=$(kubectl get pods --namespace "${namespace}" -l "$selector" -o json | jq -r --arg tag "${IMAGE_TAG}" '.items[] | select(.metadata.deletionTimestamp == null) | select(any(.spec.containers[]?; (.image | endswith(":" + $tag)))) | .metadata.name' | head -n 1)
            if [[ -z "$pod" ]]; then
              echo "No background pod available for post-deploy memory evidence"
              return 0
            fi
            container=$(kubectl get pod "$pod" --namespace "${namespace}" -o json | jq -r --arg tag "${IMAGE_TAG}" '.spec.containers[] | select(.image | endswith(":" + $tag)) | .name' | head -n 1)
            if [[ -z "$container" ]]; then
              echo "No matching background container available for post-deploy memory evidence"
              return 0
            fi

            echo "Post-deploy background cgroup memory counters"
            kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- \
              sh -c 'for file in memory.current memory.peak memory.max memory.events; do if [ -r "/sys/fs/cgroup/$file" ]; then printf "%s=" "$file"; tr "\n" "," < "/sys/fs/cgroup/$file"; printf "\n"; fi; done' || true
            echo "Post-deploy Celery and Beat process RSS (KiB)"
            kubectl exec "$pod" --namespace "${namespace}" -c "$container" -- \
              sh -c 'ps -eo pid,ppid,rss,vsz,comm,args | grep -E "[c]elery|[s]upervisord|[t]ail -qF"' || true
          }

          deploy_app "customs-regulations-api" "customs-regulations/customs-regulations-api-values.yaml" "true" ""
          deploy_app "customs-regulations-background" "customs-regulations/customs-regulations-background-values.yaml" "true" "4Gi"
          verify_benchmark_worker
          verify_regulatory_indexing_worker
          verify_regulatory_indexing_beat
          capture_background_memory_evidence
        continue-on-error: true

      - name: Check Deployment Status
        if: steps.helm_deploy.outcome == 'failure' || steps.helm_deploy.conclusion == 'failure'
        run: |
          for app_name in customs-regulations-api customs-regulations-background; do
            echo "=== Diagnostics for ${app_name} ==="
            kubectl describe deployment ${{ env.env_x }}-${app_name}-deployment -n ${{ env.namespace }} || true
            kubectl get pods --namespace ${{ env.namespace }} -l app=${{ env.env_x }}-${app_name} -o wide || true
            for pod in $(kubectl get pods --namespace ${{ env.namespace }} -l app=${{ env.env_x }}-${app_name} -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              kubectl describe pod "$pod" --namespace ${{ env.namespace }} || true
              kubectl logs "$pod" --namespace ${{ env.namespace }} --tail=200 || true
              kubectl logs "$pod" --namespace ${{ env.namespace }} --previous --tail=200 || true
            done
          done
          kubectl get events --namespace ${{ env.namespace }} --sort-by='.metadata.creationTimestamp' || true

      - name: Rollback on Failure
        id: rollback_step
        if: steps.helm_deploy.outcome == 'failure' || steps.helm_deploy.conclusion == 'failure'
        run: |
          for app_name in customs-regulations-api customs-regulations-background; do
            release="${app_name}-${{ env.env_x }}"
            if history_json=$(helm history "$release" --namespace ${{ env.namespace }} -o json 2>/dev/null); then
              rollback_revision=$(jq -r '[.[] | select(.status == "deployed" or .status == "superseded")] | sort_by(.revision | tonumber) | last | .revision // empty' <<<"$history_json")
              if [[ -n "$rollback_revision" ]]; then
                echo "Rolling back $release to revision $rollback_revision"
                helm rollback "$release" "$rollback_revision" \
                  --namespace ${{ env.namespace }} \
                  --server-side=false \
                  --wait=watcher \
                  --timeout 600s || true
                echo "ROLLBACK_PERFORMED=true" >> $GITHUB_ENV
              else
                helm uninstall "$release" --namespace ${{ env.namespace }} || true
                echo "ROLLBACK_PERFORMED=cleanup" >> $GITHUB_ENV
              fi
            fi
          done
          exit 1

      - name: Confirm Deployment Status
        if: steps.helm_deploy.outcome == 'success'
        run: echo "Deployment successful"

      - name: Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: ops-customs-regulation-chatbot
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://avatars.githubusercontent.com/u/9919?s=48&v=4
          SLACK_MESSAGE: |
            ${{ job.status }}: Job '${{ env.SERVICE_NAME }} [${{ github.run_number }}]' in environment '${{ env.space_x }}'
            ${{ env.ROLLBACK_PERFORMED == 'true' && '🔄 Rollback performed to previous revision' || env.ROLLBACK_PERFORMED == 'cleanup' && '🧹 Failed deployment cleaned up (no previous revision)' || '' }}
          SLACK_TITLE: 'Github Workflow'
          SLACK_USERNAME: Github
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

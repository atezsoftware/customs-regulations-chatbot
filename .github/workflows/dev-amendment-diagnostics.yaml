          PREFIX = "/aws/containerinsights/atez-dev-cluster/"
          PERFORMANCE_GROUP = PREFIX + "performance"
          NAMESPACE = "customs-regulations-dev"
          POD = "dev-customs-regulations-api-deployment-7bd7c785ff-nvc8x"
          CONTAINER = "dev-customs-regulations-api-container"

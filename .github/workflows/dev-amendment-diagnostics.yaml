name: DEV Resmi Gazete intake operator
run-name: DEV Resmi Gazete ${{ inputs.operation }} ${{ inputs.expected_image_sha }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        default: inspect
        options: [inspect, retry, embedding-canary, review-canary, native-probe, strict-v4-canary, reprepare-v4, retry-reprepare-v4, refresh-review, labeling-retry-plan, retry-labeling-v4, labeling-progress-v4, labeling-review-plan-v4, refresh-labeling-review-v4, labeling-failures-v4, v5-status, reprepare-plan-v5, reprepare-v5, progress-v5, acceptance-v5, strict-v5-canary]
      expected_image_sha:
        type: string
        required: true
        description: Exact deployed DEV backend image commit SHA
permissions:
  contents: read
concurrency:
  group: dev-resmigazete-f32df3a9-operator
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Inspect or retry the frozen DEV intake
        shell: bash
        env:
          EXPECTED_IMAGE_SHA: ${{ inputs.expected_image_sha }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPERATION" == inspect || "$OPERATION" == retry || "$OPERATION" == embedding-canary || "$OPERATION" == review-canary || "$OPERATION" == native-probe || "$OPERATION" == strict-v4-canary || "$OPERATION" == reprepare-v4 || "$OPERATION" == retry-reprepare-v4 || "$OPERATION" == refresh-review || "$OPERATION" == labeling-retry-plan || "$OPERATION" == retry-labeling-v4 || "$OPERATION" == labeling-progress-v4 || "$OPERATION" == labeling-review-plan-v4 || "$OPERATION" == refresh-labeling-review-v4 || "$OPERATION" == labeling-failures-v4 || "$OPERATION" == v5-status || "$OPERATION" == reprepare-plan-v5 || "$OPERATION" == reprepare-v5 || "$OPERATION" == progress-v5 || "$OPERATION" == acceptance-v5 || "$OPERATION" == strict-v5-canary ]]
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          kubectl get pods -n customs-regulations-dev -o json > /tmp/rg-pods.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = os.environ['EXPECTED_IMAGE_SHA']
          pods = json.loads(Path('/tmp/rg-pods.json').read_text())['items']
          ready = []
          for pod in pods:
              if pod['status']['phase'] != 'Running' or pod['metadata'].get('deletionTimestamp'):
                  continue
              if 'background' not in pod['metadata']['name']:
                  continue
              statuses = {item['name']:item for item in pod['status'].get('containerStatuses', [])}
              for container in pod['spec']['containers']:
                  image = container['image']
                  if 'customs-regulations-backend-lite-dev:' in image and image.endswith(':' + expected) and statuses.get(container['name'], {}).get('ready'):
                      ready.append((pod['metadata']['name'], container['name'], image.rsplit(':', 1)[1]))
          if not ready:
              raise SystemExit('No ready DEV background container at the exact expected image SHA')
          ready.sort()
          pod, container, observed = ready[0]
          print(json.dumps({'target_pod':pod, 'container':container, 'observed_image_sha':observed}))
          Path('/tmp/rg-target').write_text(pod + '\t' + container + '\t' + observed + '\n')
          PY
          IFS=$'\t' read -r pod container observed < /tmp/rg-target
          args=(--expected-image-sha "$EXPECTED_IMAGE_SHA" --observed-image-sha "$observed")
          if [[ "$OPERATION" == v5-status || "$OPERATION" == reprepare-plan-v5 || "$OPERATION" == reprepare-v5 || "$OPERATION" == progress-v5 || "$OPERATION" == acceptance-v5 || "$OPERATION" == strict-v5-canary ]]; then
            kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- sh -ec 'cat > /tmp/_new_document_rg_operator.py' < backend/onyx/db/_new_document_rg_operator.py
            kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- sh -ec 'cat > /tmp/_rg_reprepare_v5_20261103.py' < backend/onyx/db/_rg_reprepare_v5_20261103.py
            case "$OPERATION" in
              v5-status) args+=(--operation status) ;;
              reprepare-plan-v5) args+=(--operation plan) ;;
              reprepare-v5) args+=(--operation request) ;;
              progress-v5) args+=(--operation progress) ;;
              acceptance-v5) args+=(--operation acceptance) ;;
              strict-v5-canary)
                fixture=backend/tests/fixtures/regulatory/rg_v5_largest_matrix_canary.json
                kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- sh -ec 'cat > /tmp/rg-v5-matrix-canary.json' < "$fixture"
                input_sha=$(sha256sum "$fixture" | cut -d ' ' -f 1)
                args+=(--operation canary --input-path /tmp/rg-v5-matrix-canary.json --expected-input-sha "$input_sha")
                ;;
            esac
            kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
              sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec python "$@"' rg-v5 /tmp/_rg_reprepare_v5_20261103.py "${args[@]}"
            exit 0
          fi
          if [[ "$OPERATION" == labeling-retry-plan || "$OPERATION" == retry-labeling-v4 || "$OPERATION" == labeling-progress-v4 || "$OPERATION" == labeling-review-plan-v4 || "$OPERATION" == refresh-labeling-review-v4 || "$OPERATION" == labeling-failures-v4 ]]; then
            kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- sh -ec 'cat > /tmp/_new_document_rg_operator.py' < backend/onyx/db/_new_document_rg_operator.py
            kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- sh -ec 'cat > /tmp/_rg_labeling_retry_20261102.py' < backend/onyx/db/_rg_labeling_retry_20261102.py
            if [[ "$OPERATION" == retry-labeling-v4 ]]; then args+=(--retry-labeling-v4); fi
            operator_script=/tmp/_rg_labeling_retry_20261102.py
            if [[ "$OPERATION" == labeling-progress-v4 ]]; then
              kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- sh -ec 'cat > /tmp/_rg_labeling_progress_20261103.py' < backend/onyx/db/_rg_labeling_progress_20261103.py
              operator_script=/tmp/_rg_labeling_progress_20261103.py
            fi
            if [[ "$OPERATION" == labeling-review-plan-v4 || "$OPERATION" == refresh-labeling-review-v4 ]]; then
              kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- sh -ec 'cat > /tmp/_rg_review_refresh_20261103.py' < backend/onyx/db/_rg_review_refresh_20261103.py
              operator_script=/tmp/_rg_review_refresh_20261103.py
              if [[ "$OPERATION" == refresh-labeling-review-v4 ]]; then args+=(--refresh-review); fi
            fi
            if [[ "$OPERATION" == labeling-failures-v4 ]]; then
              kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- sh -ec 'cat > /tmp/_rg_labeling_failures_20261103.py' < backend/onyx/db/_rg_labeling_failures_20261103.py
              operator_script=/tmp/_rg_labeling_failures_20261103.py
              output_dir=$(kubectl exec "$pod" -n customs-regulations-dev -c "$container" -- mktemp -d /tmp/rg-labeling-failures.XXXXXX)
              args+=(--output-path "$output_dir/evidence.json")
            fi
            kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
              sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec python "$@"' rg-labeling "$operator_script" "${args[@]}"
            if [[ "$OPERATION" == labeling-failures-v4 ]]; then
              kubectl exec "$pod" -n customs-regulations-dev -c "$container" -- cat "$output_dir/evidence.json" > /tmp/rg-labeling-failures-b6fd.json
            fi
            exit 0
          fi
          if [[ "$OPERATION" == native-probe ]]; then
            fixture=backend/tests/fixtures/regulatory/rg_largest_table_final_wire.txt
            kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- sh -ec 'cat > /tmp/rg-largest-table-wire.txt' < "$fixture"
            input_sha=$(sha256sum "$fixture" | cut -d ' ' -f 1)
            kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
              sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec python -c '\''import sys; exec(compile(sys.stdin.read(), "/app/onyx/db/_rg_google_native_capability.py", "exec"))'\'' "$@"' rg-native "${args[@]}" --input-path /tmp/rg-largest-table-wire.txt --expected-input-sha "$input_sha" --embed \
              < backend/onyx/db/_rg_google_native_capability.py
            exit 0
          fi
          if [[ "$OPERATION" == retry ]]; then args+=(--retry); fi
          if [[ "$OPERATION" == embedding-canary ]]; then args+=(--embedding-canary); fi
          if [[ "$OPERATION" == review-canary ]]; then args+=(--review-canary); fi
          if [[ "$OPERATION" == reprepare-v4 ]]; then args+=(--reprepare-v4); fi
          if [[ "$OPERATION" == retry-reprepare-v4 ]]; then args+=(--retry-reprepare-v4); fi
          if [[ "$OPERATION" == refresh-review ]]; then args+=(--refresh-review); fi
          if [[ "$OPERATION" == strict-v4-canary ]]; then
            fixture=backend/tests/fixtures/regulatory/rg_largest_table_final_wire.txt
            kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- sh -ec 'cat > /tmp/rg-largest-table-wire.txt' < "$fixture"
            input_sha=$(sha256sum "$fixture" | cut -d ' ' -f 1)
            args+=(--strict-v4-canary --input-path /tmp/rg-largest-table-wire.txt --expected-input-sha "$input_sha")
          fi
          kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
            sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec python -c '\''import sys; exec(compile(sys.stdin.read(), "/app/onyx/db/_new_document_rg_operator.py", "exec"))'\'' "$@"' rg-operator "${args[@]}" \
            < backend/onyx/db/_new_document_rg_operator.py
      - name: Save bounded failed source evidence
        if: ${{ inputs.operation == 'labeling-failures-v4' }}
        uses: actions/upload-artifact@v4
        with:
          name: rg-labeling-failures-${{ github.run_id }}
          path: /tmp/rg-labeling-failures-b6fd.json
          if-no-files-found: error
          retention-days: 3

name: Read-only simple search cost evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 8
    steps:
      - name: Read retained DEV search logs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,json,subprocess,time
          def aws(*args):
              result=subprocess.run(['aws',*args,'--region','eu-central-1','--output','json'],capture_output=True,text=True)
              if result.returncode:
                  print('AWS_READ_UNAVAILABLE',json.dumps({'operation':args[0:2],'error':result.stderr[-500:]}))
                  return None
              return json.loads(result.stdout)
          groups={}
          for filters in (['--log-group-name-prefix','/aws/containerinsights/atez-dev-cluster/'],['--log-group-name-pattern','customs']):
              data=aws('logs','describe-log-groups',*filters,'--max-items','50')
              for row in (data or {}).get('logGroups',[]):
                  groups[row['logGroupName']]=row
          print('LOG_GROUPS',json.dumps([{'name':name,'retention_days':row.get('retentionInDays'),'stored_bytes':row.get('storedBytes')} for name,row in groups.items()]))
          start=int(datetime.datetime(2026,11,3,tzinfo=datetime.timezone.utc).timestamp())
          for name in list(groups)[:8]:
              if 'performance' in name or 'dataplane' in name or 'host' in name or 'prod' in name or 'test' in name:continue
              data=aws('logs','start-query','--log-group-name',name,'--start-time',str(start),'--end-time',str(int(time.time())), '--query-string','fields @timestamp, @message, @logStream | filter @message like /Catalog simple search/ | sort @timestamp asc | limit 10000')
              if not data:continue
              for _ in range(40):
                  result=aws('logs','get-query-results','--query-id',data['queryId'])
                  if not result:break
                  if result.get('status') not in ('Scheduled','Running'):break
                  time.sleep(2)
              print('LOG_QUERY',json.dumps({'group':name,'status':(result or {}).get('status'),'statistics':(result or {}).get('statistics')}))
              for row in (result or {}).get('results',[]):
                  fields={field['field']:field['value'] for field in row if field['field']!='@ptr'}
                  print('SIMPLE_SEARCH_LOG',json.dumps(fields))
          PY
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1 >/dev/null
          python - <<'PYREMOTE'
          import json,subprocess,re,urllib.request,urllib.error,ssl,base64,shlex
          r=subprocess.run(['kubectl','get','cm','fluentd-config-fluentd','-n','logging','-o','json'],capture_output=True,text=True,check=True)
          cfg=json.loads(r.stdout)['data']['04_outputs.conf']
          settings={}
          for line in cfg.splitlines():
              parts=shlex.split(line.strip())
              if len(parts)==2:settings[parts[0]]=parts[1]
          scheme=settings.get('scheme','http')
          host=settings['host'];port=settings.get('port','9200')
          assert host=='elastic.dev.singlewindow.io'
          prefix=settings.get('logstash_prefix','logstash') if settings.get('logstash_format')=='true' else settings.get('index_name','fluentd')
          assert re.fullmatch(r'[a-zA-Z0-9_.-]+',prefix)
          headers={'Content-Type':'application/json'}
          if settings.get('user'):
              token=base64.b64encode((settings['user']+':'+settings.get('password','')).encode()).decode()
              headers['Authorization']='Basic '+token
          body={'size':10000,'track_total_hits':True,'query':{'bool':{'filter':[{'range':{'@timestamp':{'gte':'2026-11-03T00:00:00Z'}}}], 'must':[{'query_string':{'query':'"Catalog simple search" OR "/api/regulatory/catalog/simple-search"','default_field':'*','lenient':True}}]}},'sort':[{'@timestamp':'asc'}]}
          url=scheme+'://'+host+':'+port+'/'+prefix+'*/_search'
          try:
              request=urllib.request.Request(url,data=json.dumps(body).encode(),headers=headers)
              with urllib.request.urlopen(request,timeout=45,context=ssl._create_unverified_context()) as response: data=json.load(response)
              print('SEARCH_LOG_RESULT',json.dumps({'total':data.get('hits',{}).get('total'),'timed_out':data.get('timed_out'),'shards':data.get('_shards')}))
              for hit in data.get('hits',{}).get('hits',[]):
                  row=hit['_source']
                  ns=row.get('kubernetes',{}).get('namespace_name')
                  if ns and ns!='customs-regulations-dev':continue
                  print('ARCHIVED_SIMPLE_SEARCH',json.dumps(row))
          except urllib.error.HTTPError as e:
              print('SEARCH_LOG_HTTP_STATUS',e.code)
          except Exception as e:
              print('SEARCH_LOG_UNAVAILABLE',type(e).__name__)
          PYREMOTE

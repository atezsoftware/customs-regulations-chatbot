name: DEV amendment approval diagnostics
run-name: DEV amendment ${{ inputs.mode || 'diagnostics' }} ${{ inputs.operation_id || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      operation_id:
        type: string
        description: Unique operator checkpoint ID for locating this run
      mode:
        type: choice
        default: diagnostics
        options: [diagnostics, baseline-audit, baseline-apply, baseline-capacity]
      expected_image_sha:
        type: string
        description: Exact deployed backend commit required for baseline operations
      expected_index_uuid:
        type: string
        description: Exact DEV physical index UUID
      file_ids:
        type: string
        description: Comma-separated file UUIDs; empty uses bounded corpus selection
      after_file_id:
        type: string
        description: Resume corpus selection after this UUID
      limit:
        type: string
        default: '100'
      profile:
        type: boolean
        default: false
        description: Capture function timings and CPU counters for a bounded baseline run
  push:
    branches: [develop]
    paths: [.github/workflows/dev-amendment-diagnostics.yaml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 60
    steps:
      - name: Read DEV database capacity
        if: inputs.mode == 'baseline-capacity'
        shell: bash
        run: |
          set -euo pipefail
          aws rds describe-db-instances --region eu-central-1 --db-instance-identifier atez-dev-db-psql \
            --query 'DBInstances[].{Identifier:DBInstanceIdentifier,Status:DBInstanceStatus,AllocatedGiB:AllocatedStorage,MaximumGiB:MaxAllocatedStorage,StorageType:StorageType}'
          aws cloudwatch get-metric-statistics --region eu-central-1 --namespace AWS/RDS \
            --metric-name FreeStorageSpace --dimensions Name=DBInstanceIdentifier,Value=atez-dev-db-psql \
            --start-time "$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" \
            --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --period 300 --statistics Minimum Average \
            --query '{Label:Label,Datapoints:Datapoints}'
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          kubectl get pods -n customs-regulations-dev -l app=dev-customs-regulations-background -o json \
            | jq '[.items[] | select(.metadata.deletionTimestamp == null) | {name:.metadata.name,containers:[.spec.containers[] | {name,resources}]}]'
          kubectl top pods -n customs-regulations-dev -l app=dev-customs-regulations-background
      - name: Read DEV worker failure traces
        if: inputs.mode == 'diagnostics' || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          kubectl get pods -n customs-regulations-dev -o json | jq '[.items[] | select(.metadata.name | test("customs-regulations-(api|background)")) | {name:.metadata.name,phase:.status.phase,terminating:.metadata.deletionTimestamp,containers:[.status.containerStatuses[]? | {name,ready,restartCount,state}],image:[.spec.containers[].image]}]'
          pods=$(kubectl get pods -n customs-regulations-dev -l app=dev-customs-regulations-background -o json)
          while IFS=$'\t' read -r pod container; do
            kubectl exec "$pod" -n customs-regulations-dev -c "$container" -- python -c '
          import json,re,subprocess
          from pathlib import Path
          print(subprocess.run(["supervisorctl","-c","/etc/supervisor/conf.d/supervisord.conf","status"],capture_output=True,text=True).stdout)
          print(json.dumps({"worker_readiness": {name:Path("/tmp/onyx_k8s_"+name+"_readiness.txt").exists() for name in ("regulatorybenchmark","regulatoryindexing")}}))
          startup_errors=[]
          for path in Path("/var/log/onyx").glob("celery_worker_regulatory*.log"):
              for line in path.read_text(errors="replace").splitlines()[-200:]:
                  if re.search(r"api.key|password|secret|authorization|bearer",line,re.I):
                      continue
                  if re.match(r"\s*File \"",line) or re.match(r"^[\w.]+(?:Error|Exception):",line):
                      startup_errors.append({"log":path.name,"trace":line[:500]})
          print(json.dumps({"worker_startup_traces":startup_errors[-30:]},ensure_ascii=False))
          lines=Path("/var/log/onyx/celery_worker_regulatory_benchmark.log").read_text(errors="replace").splitlines()[-20000:]
          failures=[]
          for i,line in enumerate(lines):
              if not re.search(r"Amendment proposal \d+ approval failed",line):
                  continue
              trace=[]
              for part in lines[i+1:i+120]:
                  if re.search(r"Amendment proposal \d+ approval failed",part):
                      break
                  if re.search(r"api.key|password|secret|authorization|bearer",part,re.I):
                      continue
                  if re.match(r"\s*File \"",part) or re.match(r"^[\w.]+(?:Error|Exception|Lost|Conflict):",part):
                      trace.append(part[:500])
                  if trace and re.match(r"^[\w.]+(?:Error|Exception|Lost|Conflict):",part):
                      break
              failures.append({"event":line[:220],"trace":trace})
          print(json.dumps(failures[-10:],ensure_ascii=False,indent=2))
          timings=[line for line in lines if re.search(r"(?:amendment_context_impact|amendment_prepared|writer_publication_finished|amendment_approved) ",line)]
          print(json.dumps({"publication_timings":timings[-30:]},ensure_ascii=False,indent=2))
          '
          done < <(jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .metadata.name as $pod | .spec.containers[] | select(.image | contains("customs-regulations-backend-lite")) | [$pod,.name] | @tsv' <<<"$pods")

      - name: Prepare verified DEV publication baselines
        if: inputs.mode == 'baseline-audit' || inputs.mode == 'baseline-apply'
        shell: bash
        env:
          BASELINE_MODE: ${{ inputs.mode }}
          EXPECTED_IMAGE_SHA: ${{ inputs.expected_image_sha }}
          EXPECTED_INDEX_UUID: ${{ inputs.expected_index_uuid }}
          FILE_IDS: ${{ inputs.file_ids }}
          AFTER_FILE_ID: ${{ inputs.after_file_id }}
          FILE_LIMIT: ${{ inputs.limit }}
          BASELINE_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_INDEX_UUID" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$FILE_LIMIT" =~ ^[1-9][0-9]*$ ]] && (( FILE_LIMIT <= 500 ))
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          pods=$(kubectl get pods -n customs-regulations-dev -l app=dev-customs-regulations-background -o json)
          selected=$(jq -r --arg sha "$EXPECTED_IMAGE_SHA" '.items[] | select(.metadata.deletionTimestamp == null and .status.phase == "Running") | .metadata.name as $pod | .spec.containers[] | select(.image | endswith(":" + $sha)) | [$pod,.name] | @tsv' <<<"$pods" | head -n 1)
          [[ -n "$selected" ]]
          IFS=$'\t' read -r pod container <<<"$selected"
          args=(--expected-database customs-regulations-dev --expected-index-uuid "$EXPECTED_INDEX_UUID" --limit "$FILE_LIMIT" --output "/tmp/baseline-${GITHUB_RUN_ID}.jsonl")
          if [[ -n "$FILE_IDS" ]]; then
            IFS=',' read -ra identifiers <<<"$FILE_IDS"
            for identifier in "${identifiers[@]}"; do
              [[ "$identifier" =~ ^[0-9a-f-]{36}$ ]]
              args+=(--file-id "$identifier")
            done
          fi
          if [[ -n "$AFTER_FILE_ID" ]]; then
            [[ "$AFTER_FILE_ID" =~ ^[0-9a-f-]{36}$ ]]
            args+=(--after-file-id "$AFTER_FILE_ID")
          fi
          if [[ "$BASELINE_MODE" == baseline-apply ]]; then args+=(--apply); fi
          python_args=(/app/scripts/prepare_regulatory_publication_baselines.py)
          if [[ "$BASELINE_PROFILE" == true ]]; then
            python_args=(-m cProfile -o "/tmp/baseline-${GITHUB_RUN_ID}.prof" "${python_args[@]}")
            kubectl exec "$pod" -n customs-regulations-dev -c "$container" -- python -c '
          from pathlib import Path
          for name in ("cpu.max", "cpu.stat", "memory.current"):
              path = Path("/sys/fs/cgroup") / name
              if path.exists(): print(name, path.read_text())
          ' > baseline-cpu-before.txt
          fi
          set +e
          kubectl exec "$pod" -n customs-regulations-dev -c "$container" -- \
            sh -ec '. /vault/secrets/config; exec python "$@"' baseline-cli "${python_args[@]}" "${args[@]}"
          result=$?
          set -e
          kubectl exec "$pod" -n customs-regulations-dev -c "$container" -- cat "/tmp/baseline-${GITHUB_RUN_ID}.jsonl" > baseline-report.jsonl
          if [[ "$BASELINE_PROFILE" == true ]]; then
            kubectl exec "$pod" -n customs-regulations-dev -c "$container" -- python -c '
          import pstats,sys
          from pathlib import Path
          stats = pstats.Stats(sys.argv[1])
          stats.sort_stats("cumulative").print_stats(70)
          stats.sort_stats("tottime").print_stats(30)
          stats.print_callers("publication_digest|validate_observation|load_owned_writer_inputs|stage_writer_publication")
          for name in ("cpu.max", "cpu.stat", "memory.current"):
              path = Path("/sys/fs/cgroup") / name
              if path.exists(): print(name, path.read_text())
          ' "/tmp/baseline-${GITHUB_RUN_ID}.prof" > baseline-profile.txt
          fi
          exit "$result"
      - name: Preserve baseline evidence report
        if: always() && inputs.mode != 'diagnostics' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-report-${{ github.run_id }}
          path: |
            baseline-report.jsonl
            baseline-profile.txt
            baseline-cpu-before.txt
          if-no-files-found: ignore

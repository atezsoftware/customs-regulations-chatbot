name: Simple-search ten-query live cost measurement
on:
  workflow_dispatch:
    inputs:
      start:
        type: string
        default: '0'
      stop:
        type: string
        default: '10'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Measure existing DEV simple-search pipeline
        env:
          BENCH_START: ${{ inputs.start }}
          BENCH_STOP: ${{ inputs.stop }}
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1 >/dev/null
          python - <<'PY'
          import os,json,subprocess
          pods=json.loads(subprocess.check_output(['kubectl','get','pods','-n','customs-regulations-dev','-o','json']))['items']
          targets=[]
          for p in pods:
              if 'customs-regulations-api' not in p['metadata']['name'] or p['status']['phase']!='Running':continue
              statuses={s['name']:s for s in p['status'].get('containerStatuses',[])}
              for c in p['spec']['containers']:
                  if 'customs-regulations-backend-lite-dev:' in c['image'] and statuses.get(c['name'],{}).get('ready'):
                      targets.append((p['metadata']['name'],c['name'],c['image']))
          assert targets,'No ready DEV API pod'
          pod,container,image=sorted(targets)[0]
          print('BENCH_TARGET',json.dumps({'pod':pod,'image':image}),flush=True)
          start,stop=int(os.environ['BENCH_START']),int(os.environ['BENCH_STOP'])
          assert 0<=start<stop<=10
          command=['kubectl','exec','-i',pod,'-n','customs-regulations-dev','-c',container,'--','sh','-ec','. /vault/secrets/config; export PYTHONPATH=/app; exec python - "$1" "$2"','sh',str(start),str(stop)]
          with open('backend/onyx/db/simple_search_cost_benchmark.py') as source:
              process=subprocess.Popen(command,stdin=source,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              for line in process.stdout:
                  if line.startswith('BENCH_'): print(line.rstrip(),flush=True)
              code=process.wait()
          assert code==0,f'Benchmark process exited {code}'
          PY

name: DEV amendment approval diagnostics
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, approve_442, approve_443, approve_462, approve_465, approve_470, approve_481, approve_482, repair_299, retry_306]
        default: inspect
permissions:
  contents: read
jobs:
  inspect:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read only batch inventory
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          kubectl get pods -n customs-regulations-dev -o json > /tmp/amendment-pods.json
          python - <<'PY'
          import json
          from pathlib import Path
          pods=json.loads(Path('/tmp/amendment-pods.json').read_text())['items']
          ready=[]
          for pod in pods:
              if pod['status']['phase']!='Running' or pod['metadata'].get('deletionTimestamp'):
                  continue
              statuses={item['name']:item for item in pod['status'].get('containerStatuses',[])}
              for container in pod['spec']['containers']:
                  image=container['image']
                  if 'customs-regulations-backend-lite-dev:' in image and statuses.get(container['name'],{}).get('ready'):
                      ready.append((pod['metadata']['name'],container['name'],image))
          if not ready:
              raise SystemExit('No ready DEV backend container')
          ready.sort()
          pod,container,image=ready[0]
          print('TARGET',pod,container,image)
          Path('/tmp/amendment-target').write_text(pod+'\t'+container+'\n')
          PY
          IFS=$'\t' read -r pod container < /tmp/amendment-target
          kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
            sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec python -' < \
            backend/onyx/db/diagnose_amendment_batches_299_310.py
      - name: Filter amendment approval worker errors
        if: inputs.operation == 'inspect'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          pods = json.loads(Path('/tmp/amendment-pods.json').read_text())['items']
          needles = re.compile(r'Amendment proposal (460|462|465|470) approval failed|amendment_(prepared|approved) proposal_id=(460|462|465|470)')
          for pod in pods:
              name = pod['metadata']['name']
              if pod['status']['phase'] != 'Running' or 'background' not in name:
                  continue
              for container in pod['spec']['containers']:
                  result = subprocess.run(
                      ['kubectl', 'logs', name, '-n', 'customs-regulations-dev',
                       '-c', container['name'], '--since=36h', '--tail=30000'],
                      capture_output=True, text=True, check=False,
                  )
                  if result.returncode:
                      print('LOG_READ_FAILED', name, container['name'], result.returncode)
                      continue
                  lines = result.stdout.splitlines()
                  print('LOG_SCAN', name, container['name'], len(lines))
                  for index, line in enumerate(lines):
                      if needles.search(line):
                          print('LOG_MATCH', name, container['name'])
                          for excerpt in lines[index:index + 45]:
                              print(excerpt[:500])
          PY
      - name: Resume one existing reviewed proposal
        if: startsWith(inputs.operation, 'approve_')
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            approve_442) proposal_id=442 ;;
            approve_443) proposal_id=443 ;;
            approve_462) proposal_id=462 ;;
            approve_465) proposal_id=465 ;;
            approve_470) proposal_id=470 ;;
            approve_481) proposal_id=481 ;;
            approve_482) proposal_id=482 ;;
            *) exit 2 ;;
          esac
          IFS=$'\t' read -r pod container < /tmp/amendment-target
          kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
            sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec python - "$1"' sh "$proposal_id" < \
            backend/onyx/db/resume_amendment_approvals_309_310.py
      - name: Restore one frozen batch 299 match without batch retry
        if: inputs.operation == 'repair_299'
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\t' read -r pod container < /tmp/amendment-target
          kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
            sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec python -' < \
            backend/onyx/db/repair_amendment_batch_299.py
      - name: Retry only batch 306's unmatched instruction
        if: inputs.operation == 'retry_306'
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\t' read -r pod container < /tmp/amendment-target
          kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
            sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec python -' < \
            backend/onyx/db/retry_amendment_batch_306.py

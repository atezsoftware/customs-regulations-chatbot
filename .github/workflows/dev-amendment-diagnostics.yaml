name: DEV amendment approval diagnostics
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect]
        default: inspect
      full_corpus_hashes:
        type: boolean
        default: false
      decode_metadata_cache:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read only batch inventory
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          kubectl get pods -n customs-regulations-dev -o json > /tmp/amendment-pods.json
          python - <<'PY'
          import json
          from pathlib import Path
          pods=json.loads(Path('/tmp/amendment-pods.json').read_text())['items']
          ready=[]
          for pod in pods:
              if pod['status']['phase']!='Running' or pod['metadata'].get('deletionTimestamp'):
                  continue
              statuses={item['name']:item for item in pod['status'].get('containerStatuses',[])}
              for container in pod['spec']['containers']:
                  image=container['image']
                  if 'customs-regulations-backend-lite-dev:' in image and statuses.get(container['name'],{}).get('ready'):
                      ready.append((pod['metadata']['name'],container['name'],image))
          if not ready:
              raise SystemExit('No ready DEV backend container')
          ready.sort()
          pod,container,image=ready[0]
          print('TARGET',pod,container,image)
          Path('/tmp/amendment-target').write_text(pod+'\t'+container+'\n')
          PY
          IFS=$'\t' read -r pod container < /tmp/amendment-target
          kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
            sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec env FOLDER_PROGRESS_ONLY="$1" python -' sh "${{ inputs.full_corpus_hashes && '0' || '1' }}" < \
            backend/onyx/db/diagnose_folder_intake_readonly.py
      - name: Read only scoped worker activity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          pods=json.loads(Path('/tmp/amendment-pods.json').read_text())['items']
          ready=[]
          for pod in pods:
              if pod['status']['phase']!='Running' or pod['metadata'].get('deletionTimestamp') or 'background' not in pod['metadata']['name']:
                  continue
              statuses={item['name']:item for item in pod['status'].get('containerStatuses',[])}
              for container in pod['spec']['containers']:
                  if 'customs-regulations-backend-lite-dev:' in container['image'] and statuses.get(container['name'],{}).get('ready'):
                      ready.append((pod['metadata']['name'],container['name']))
          if len(ready)!=1:
              raise SystemExit('Expected exactly one Ready DEV background container')
          pod,container=ready[0]
          Path('/tmp/folder-worker-target').write_text(pod+'\t'+container+'\n')
          PY
          IFS=$'\t' read -r pod container < /tmp/folder-worker-target
          kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
            sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec python -' < \
            backend/onyx/db/diagnose_folder_worker_readonly.py
      - name: Diagnose exact cached metadata validation
        if: inputs.decode_metadata_cache
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\t' read -r pod container < /tmp/amendment-target
          kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
            sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec python -' < \
            backend/onyx/db/diagnose_intake_metadata_cache_readonly.py
      - name: Read only DEV and TEST broker namespace settings
        shell: bash
        run: |
          set -euo pipefail
          for scope in customs-regulations-dev customs-regulations-test; do
            kubectl get pods -n "$scope" -o json > "/tmp/broker-pods-$scope.json"
            python - "$scope" <<'PY'
          import json,sys
          from pathlib import Path
          scope=sys.argv[1]
          assert scope in {'customs-regulations-dev','customs-regulations-test'}
          suffix=scope.rsplit('-',1)[1]
          pods=json.loads(Path('/tmp/broker-pods-'+scope+'.json').read_text())['items']
          targets=[]
          for pod in pods:
              if pod['status']['phase']!='Running' or pod['metadata'].get('deletionTimestamp') or 'background' not in pod['metadata']['name']:
                  continue
              statuses={item['name']:item for item in pod['status'].get('containerStatuses',[])}
              for container in pod['spec']['containers']:
                  if 'customs-regulations-backend-lite-'+suffix+':' in container['image'] and statuses.get(container['name'],{}).get('ready'):
                      targets.append((pod['metadata']['name'],container['name']))
          assert len(targets)==1, 'Expected one ready scoped background container'
          Path('/tmp/broker-target-'+scope).write_text('\t'.join(targets[0])+'\n')
          PY
            IFS=$'\t' read -r pod container < "/tmp/broker-target-$scope"
            kubectl exec -i "$pod" -n "$scope" -c "$container" -- \
              sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; exec env DIAGNOSTIC_SCOPE="$1" python -' sh "$scope" < \
              backend/onyx/db/diagnose_broker_namespace_readonly.py
          done
      - name: Filter amendment approval worker errors
        if: inputs.operation == 'inspect'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          pods = json.loads(Path('/tmp/amendment-pods.json').read_text())['items']
          needles = re.compile(r'acquire_amendment_sources|regulatory_document_intake_prepare|Source package|source.package|regulatory_annex|lease expired|discarding revoked|ERROR|Traceback')
          for pod in pods:
              name = pod['metadata']['name']
              if pod['status']['phase'] != 'Running' or 'background' not in name:
                  continue
              for container in pod['spec']['containers']:
                  result = subprocess.run(
                      ['kubectl', 'logs', name, '-n', 'customs-regulations-dev',
                       '-c', container['name'], '--since=50m', '--tail=16000'],
                      capture_output=True, text=True, check=False,
                  )
                  if result.returncode:
                      print('LOG_READ_FAILED', name, container['name'], result.returncode)
                      continue
                  lines = result.stdout.splitlines()
                  print('LOG_SCAN', name, container['name'], len(lines))
                  matches = 0
                  for index, line in enumerate(lines):
                      if needles.search(line):
                          matches += 1
                          if matches > 100:
                              break
                          print('LOG_MATCH', name, container['name'])
                          for excerpt in lines[index:index + 12]:
                              if re.search(r'api.key|authorization|bearer|password|secret|token=', excerpt, re.I):
                                  print('[credential-bearing line omitted]')
                              else:
                                  print(excerpt[:450])
          PY

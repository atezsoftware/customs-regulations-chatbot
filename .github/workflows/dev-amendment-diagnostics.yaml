name: DEV API read-only memory observer

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        default: observe
        options: [observe]
      expected_image_sha:
        type: string
        required: true
        description: Exact 40-character SHA already running on DEV API
      duration_minutes:
        type: string
        required: true
        default: "30"
        description: Observation duration, 1 to 30 minutes

permissions:
  contents: read

jobs:
  observe:
    if: inputs.operation == 'observe'
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 37
    steps:
      - name: Sample existing DEV API pods without changing them
        shell: bash
        env:
          EXPECTED_IMAGE_SHA: ${{ inputs.expected_image_sha }}
          OBSERVE_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OBSERVE_MINUTES" =~ ^[1-9][0-9]?$ ]] && (( OBSERVE_MINUTES <= 30 ))
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          python3 - <<'PY'
          import concurrent.futures
          import datetime
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          NAMESPACE = "customs-regulations-dev"
          DEPLOYMENT = "dev-customs-regulations-api-deployment"
          SELECTOR = "app=dev-customs-regulations-api"
          EXPECTED_SHA = os.environ["EXPECTED_IMAGE_SHA"]
          DURATION_SECONDS = int(os.environ["OBSERVE_MINUTES"]) * 60
          OUTPUT = Path("dev-api-memory-samples.jsonl")
          # The short-lived probe is excluded from PID RSS, but contributes to
          # cgroup current/peak. Keep an idle baseline to quantify that overhead.
          POD_SAMPLE = r'''
          import json
          import os
          from pathlib import Path

          cgroup = Path("/sys/fs/cgroup")

          def integer_file(name):
              try:
                  return int((cgroup / name).read_text().strip())
              except (FileNotFoundError, PermissionError, ValueError):
                  return None

          def number_map(name, selected=None):
              result = {}
              try:
                  for line in (cgroup / name).read_text().splitlines():
                      key, value = line.split(maxsplit=1)
                      if selected is None or key in selected:
                          result[key] = int(value)
              except (FileNotFoundError, PermissionError, ValueError):
                  pass
              return result

          processes = []
          own_pid = os.getpid()
          for proc in Path("/proc").glob("[0-9]*"):
              try:
                  pid = int(proc.name)
                  if pid == own_pid:
                      continue
                  values = {}
                  for line in (proc / "status").read_text().splitlines():
                      if line.startswith(("Name:", "VmRSS:", "VmHWM:", "RssAnon:", "RssFile:")):
                          key, value = line.split(":", 1)
                          values[key] = value.strip().split()[0]
                  processes.append({
                      "pid": pid,
                      "name": values.get("Name", ""),
                      "rss_kib": int(values.get("VmRSS", 0)),
                      "hwm_kib": int(values.get("VmHWM", 0)),
                      "anon_kib": int(values.get("RssAnon", 0)),
                      "file_kib": int(values.get("RssFile", 0)),
                  })
              except (FileNotFoundError, ProcessLookupError, PermissionError, ValueError):
                  continue

          print(json.dumps({
              "current_bytes": integer_file("memory.current"),
              "peak_bytes": integer_file("memory.peak"),
              "max_bytes": integer_file("memory.max"),
              "events": number_map("memory.events"),
              "stat": number_map("memory.stat", {"anon", "file"}),
              "processes": sorted(processes, key=lambda item: item["pid"]),
          }, separators=(",", ":")))
          '''

          def command(args, timeout=8, input_text=None):
              result = subprocess.run(
                  args, input=input_text, capture_output=True, text=True, timeout=timeout
              )
              if result.returncode:
                  raise RuntimeError(f"{args[0]} exited {result.returncode}")
              return result.stdout

          def now_utc():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()

          def get_pods():
              data = json.loads(command([
                  "kubectl", "get", "pods", "-n", NAMESPACE, "-l", SELECTOR,
                  "-o", "json", "--request-timeout=5s",
              ]))
              selected = []
              status = []
              for pod in data["items"]:
                  metadata = pod["metadata"]
                  state = pod.get("status", {})
                  containers = [
                      item for item in pod["spec"].get("containers", [])
                      if item["image"].endswith(":" + EXPECTED_SHA)
                  ]
                  container_name = containers[0]["name"] if len(containers) == 1 else None
                  matching_status = next(
                      (item for item in state.get("containerStatuses", [])
                       if item["name"] == container_name), {}
                  )
                  ready = (
                      metadata.get("deletionTimestamp") is None
                      and state.get("phase") == "Running"
                      and container_name is not None
                      and matching_status.get("ready") is True
                  )
                  status.append({
                      "pod": metadata["name"],
                      "uid": metadata["uid"],
                      "ready": ready,
                      "restart_count": matching_status.get("restartCount"),
                      "last_reason": matching_status.get("lastState", {})
                          .get("terminated", {}).get("reason"),
                      "image_matches": container_name is not None,
                  })
                  if ready:
                      selected.append((metadata["name"], metadata["uid"], container_name))
              return selected, status

          def sample_pod(pod):
              name, uid, container = pod
              raw = command([
                  "kubectl", "exec", "-i", name, "-n", NAMESPACE, "-c", container,
                  "--", "python", "-",
              ], timeout=5, input_text=POD_SAMPLE)
              return name, uid, json.loads(raw)

          deployment = json.loads(command([
              "kubectl", "get", "deployment", DEPLOYMENT, "-n", NAMESPACE, "-o", "json",
              "--request-timeout=5s",
          ]))
          deployed_containers = deployment["spec"]["template"]["spec"]["containers"]
          if (
              deployment["spec"].get("replicas") != 2
              or deployment["status"].get("readyReplicas") != 2
              or sum(item["image"].endswith(":" + EXPECTED_SHA)
                     for item in deployed_containers) != 1
          ):
              raise RuntimeError("DEV API deployment is not two Ready replicas of expected image")

          initial_pods, initial_status = get_pods()
          if len(initial_pods) != 2 or len(initial_status) != 2:
              raise RuntimeError("DEV API does not have exactly two Ready expected-image pods")

          print(f"SAMPLING_READY expected_image_sha={EXPECTED_SHA} pods=2", flush=True)
          start = time.monotonic()
          next_tick = start
          tick = 0
          with OUTPUT.open("w", encoding="utf-8", buffering=1) as output:
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  while time.monotonic() - start < DURATION_SECONDS:
                      stamp = now_utc()
                      try:
                          pods, status = get_pods()
                          output.write(json.dumps({
                              "time": stamp, "kind": "pod_status", "pods": status,
                          }, separators=(",", ":")) + "\n")
                          if len(pods) != 2:
                              print(f"OBSERVE_POD_COUNT time={stamp} ready={len(pods)}", flush=True)
                          futures = {pool.submit(sample_pod, pod): pod for pod in pods}
                          for future in concurrent.futures.as_completed(futures):
                              pod = futures[future]
                              try:
                                  name, uid, sample = future.result()
                                  output.write(json.dumps({
                                      "time": stamp, "kind": "memory", "pod": name,
                                      "uid": uid, **sample,
                                  }, separators=(",", ":")) + "\n")
                                  rss = sum(item["rss_kib"] for item in sample["processes"])
                                  print(
                                      f"SAMPLE time={stamp} pod={name} "
                                      f"current={sample['current_bytes']} peak={sample['peak_bytes']} "
                                      f"anon={sample['stat'].get('anon')} "
                                      f"file={sample['stat'].get('file')} "
                                      f"oom_kill={sample['events'].get('oom_kill')} "
                                      f"pid_rss_kib_sum={rss} pid_count={len(sample['processes'])}",
                                      flush=True,
                                  )
                              except (RuntimeError, subprocess.TimeoutExpired, ValueError) as error:
                                  output.write(json.dumps({
                                      "time": stamp, "kind": "sample_error", "pod": pod[0],
                                      "error_type": type(error).__name__,
                                  }, separators=(",", ":")) + "\n")
                      except (RuntimeError, subprocess.TimeoutExpired, ValueError, KeyError) as error:
                          output.write(json.dumps({
                              "time": stamp, "kind": "status_error",
                              "error_type": type(error).__name__,
                          }, separators=(",", ":")) + "\n")
                      tick += 1
                      next_tick += 5
                      delay = next_tick - time.monotonic()
                      if delay > 0:
                          time.sleep(delay)
                      else:
                          next_tick = time.monotonic()
          print(f"SAMPLING_COMPLETE ticks={tick}", flush=True)
          PY

      - name: Preserve read-only numeric samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-api-memory-samples-${{ github.run_id }}
          path: dev-api-memory-samples.jsonl
          if-no-files-found: ignore
          retention-days: 7

name: DEV read-only Tariff runtime diagnostics
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, frozen_6455]
        default: inspect
      expected_version:
        type: string
        default: ''
      manifest_sha:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  inspect:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read only filtered DEV runtime evidence
        if: inputs.operation == 'inspect'
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          python backend/scripts/diagnose_tariff_runtime_logs.py
      - name: Read one exact frozen 6455 derivative
        if: inputs.operation == 'frozen_6455'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          MANIFEST_SHA: ${{ inputs.manifest_sha }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          python backend/onyx/db/diagnose_6455_frozen_source_20261103.py --expected-version "$EXPECTED_VERSION" --manifest-sha "$MANIFEST_SHA"

name: DEV single query cancellation
run-name: Stop DEV query 09854000
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stop:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    steps:
      - name: Stop only the user-selected running query
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          kubectl get pods -n customs-regulations-dev -l app=dev-customs-regulations-api -o json > /tmp/query-stop-pods.json
          python - <<'PY'
          import json
          from pathlib import Path
          targets=[]
          for p in json.loads(Path('/tmp/query-stop-pods.json').read_text())['items']:
              if p['metadata'].get('deletionTimestamp') or p['status']['phase']!='Running': continue
              ready={s['name'] for s in p['status'].get('containerStatuses',[]) if s.get('ready')}
              for c in p['spec']['containers']:
                  if c['name'] in ready and c['image'].endswith(':79d9da6931c70f6e9b17caec3b321fe3214161d8'):
                      targets.append((p['metadata']['name'],c['name']))
          if not targets: raise SystemExit('No ready pinned DEV API container found')
          Path('/tmp/query-stop-target').write_text('\t'.join(targets[0])+'\n')
          PY
          IFS=$'\t' read -r pod container < /tmp/query-stop-target
          kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; cd /app/onyx/db; exec python -' <<'PY'
          import json, os, time
          from uuid import UUID
          import psycopg2
          from onyx.cache.factory import get_cache_backend
          from onyx.chat.stop_signal_checker import set_fence, is_connected
          from onyx.configs.app_configs import REDIS_DB_NUMBER
          chat=UUID('09854000-d1c9-4b8d-aa89-f681b9b9399d')
          conn=psycopg2.connect(host=os.environ['POSTGRES_HOST'],port=os.environ.get('POSTGRES_PORT','5432'),user=os.environ['POSTGRES_USER'],password=os.environ['POSTGRES_PASSWORD'],dbname=os.environ['POSTGRES_DB'],connect_timeout=10)
          conn.set_session(readonly=True,autocommit=True)
          with conn.cursor() as cur:
              cur.execute('SELECT cs.id FROM public.chat_session cs JOIN public."user" u ON u.id=cs.user_id WHERE cs.id=%s AND u.email=%s AND NOT cs.deleted',(str(chat),'kubilay.payci@atez.com'))
              assert cur.fetchone(), 'Exact selected query owner not verified'
          cache=get_cache_backend(tenant_id='public')
          assert REDIS_DB_NUMBER==4, 'Unexpected DEV Redis allocation'
          set_fence(chat,cache,True)
          assert not is_connected(chat,cache), 'Stop fence not observed'
          print(json.dumps({'chat_id':str(chat),'stop_signal_confirmed':True,'cache_backend':type(cache).__name__,'redis_database':REDIS_DB_NUMBER,'deployments':0,'other_queries_modified':0}),flush=True)
          def status():
              with conn.cursor() as cur:
                  cur.execute("SELECT id,length(message),processing_duration_seconds,error FROM public.chat_message WHERE chat_session_id=%s AND message_type='ASSISTANT' ORDER BY id DESC LIMIT 1",(str(chat),))
                  r=cur.fetchone()
              return {'assistant_id':r[0],'answer_characters':r[1],'processing_seconds':r[2],'has_error':bool(r[3])}
          print(json.dumps({'immediately_after_stop':status()},default=str),flush=True)
          time.sleep(35)
          print(json.dumps({'after_stop':status(),'stop_signal_still_present':not is_connected(chat,cache)},default=str),flush=True)
          conn.close()
          PY

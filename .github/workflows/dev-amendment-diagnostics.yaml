name: TEST migration recovery inspection
run-name: TEST migration inspection ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Inspect TEST and DEV
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          mkdir -p evidence
          for ns in customs-regulations-test customs-regulations-dev; do
            kubectl get deploy,pods -n "$ns" -o json | jq '[.items[] | {kind,name:.metadata.name,images:[.spec.template.spec.containers[]?.image,.spec.containers[]?.image],ready:.status.readyReplicas,containers:[.status.containerStatuses[]? | {name,ready,restartCount,imageID,state}],node:.spec.nodeName}]' | tee "evidence/$ns-workloads.json"
          done
          deployment=$(kubectl get deploy -n customs-regulations-test -l app=devops -o json | jq -r '.items[] | select(.metadata.name | contains("customs-regulations-api")) | .metadata.name' | head -n 1)
          if [[ -z "$deployment" ]]; then
            deployment=$(kubectl get deploy -n customs-regulations-test -o json | jq -r '.items[] | select(.metadata.name | contains("customs-regulations-api")) | .metadata.name' | head -n 1)
          fi
          [[ -n "$deployment" ]]
          kubectl get deploy "$deployment" -n customs-regulations-test -o json > /tmp/test-deployment.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/test-deployment.json'))
          template=d['spec']['template']
          metadata=template['metadata']
          metadata['name']='test-migration-probe-'+os.environ['GITHUB_RUN_ID']
          metadata['namespace']='customs-regulations-test'
          metadata['labels']={'app':'test-migration-probe'}
          metadata.pop('creationTimestamp',None)
          spec=template['spec']
          spec['restartPolicy']='Never'
          spec['activeDeadlineSeconds']=600
          for c in spec['containers']:
              c['command']=['/bin/sh','-c','sleep 600']
              c.pop('args',None)
              for k in ('readinessProbe','livenessProbe','startupProbe'):
                  c.pop(k,None)
          json.dump({'apiVersion':'v1','kind':'Pod','metadata':metadata,'spec':spec},open('/tmp/probe-pod.json','w'))
          PY
          pod="test-migration-probe-${GITHUB_RUN_ID}"
          trap 'kubectl delete pod "$pod" -n customs-regulations-test --ignore-not-found --wait=false' EXIT
          kubectl create -f /tmp/probe-pod.json
          kubectl wait pod "$pod" -n customs-regulations-test --for=condition=Ready --timeout=180s
          container=$(kubectl get deploy "$deployment" -n customs-regulations-test -o json | jq -r '.spec.template.spec.containers[0].name')
          kubectl exec -i "$pod" -n customs-regulations-test -c "$container" -- sh -ec '. /vault/secrets/config; cd /app/onyx/db; python - customs-regulations-test' < backend/onyx/db/test_migration_identity_probe.py | tee evidence/test-database.json
          devpod=$(kubectl get pods -n customs-regulations-dev -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | select(.metadata.name | contains("customs-regulations-api")) | select(any(.status.containerStatuses[]?; .ready and (.image | contains("backend-lite")))) | .metadata.name' | head -n 1)
          [[ -n "$devpod" ]]
          devcontainer=$(kubectl get pod "$devpod" -n customs-regulations-dev -o json | jq -r '.spec.containers[] | select(.image | contains("backend-lite")) | .name' | head -n 1)
          kubectl exec -i "$devpod" -n customs-regulations-dev -c "$devcontainer" -- sh -ec '. /vault/secrets/config; cd /app/onyx/db; python - customs-regulations-dev' < backend/onyx/db/test_migration_identity_probe.py | tee evidence/dev-database.json
          python3 - <<'PY'
          import json
          test=json.load(open('evidence/test-database.json'))
          dev=json.load(open('evidence/dev-database.json'))
          assert (test['server'],test['port'],test['database']) != (dev['server'],dev['port'],dev['database'])
          print('Verified TEST and DEV database identities are separate')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-migration-inspection
          path: evidence/

name: Read-only simple search cost evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 8
    steps:
      - name: Read retained DEV search logs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,json,subprocess,time
          def aws(*args):
              result=subprocess.run(['aws',*args,'--region','eu-central-1','--output','json'],capture_output=True,text=True)
              if result.returncode:
                  print('AWS_READ_UNAVAILABLE',json.dumps({'operation':args[0:2],'error':result.stderr[-500:]}))
                  return None
              return json.loads(result.stdout)
          groups={}
          for filters in (['--log-group-name-prefix','/aws/containerinsights/atez-dev-cluster/'],['--log-group-name-pattern','customs']):
              data=aws('logs','describe-log-groups',*filters,'--max-items','50')
              for row in (data or {}).get('logGroups',[]):
                  groups[row['logGroupName']]=row
          print('LOG_GROUPS',json.dumps([{'name':name,'retention_days':row.get('retentionInDays'),'stored_bytes':row.get('storedBytes')} for name,row in groups.items()]))
          start=int(datetime.datetime(2026,11,3,tzinfo=datetime.timezone.utc).timestamp())
          for name in list(groups)[:8]:
              if 'performance' in name or 'dataplane' in name or 'host' in name or 'prod' in name or 'test' in name:continue
              data=aws('logs','start-query','--log-group-name',name,'--start-time',str(start),'--end-time',str(int(time.time())), '--query-string','fields @timestamp, @message, @logStream | filter @message like /Catalog simple search/ | sort @timestamp asc | limit 10000')
              if not data:continue
              for _ in range(40):
                  result=aws('logs','get-query-results','--query-id',data['queryId'])
                  if not result:break
                  if result.get('status') not in ('Scheduled','Running'):break
                  time.sleep(2)
              print('LOG_QUERY',json.dumps({'group':name,'status':(result or {}).get('status'),'statistics':(result or {}).get('statistics')}))
              for row in (result or {}).get('results',[]):
                  fields={field['field']:field['value'] for field in row if field['field']!='@ptr'}
                  print('SIMPLE_SEARCH_LOG',json.dumps(fields))
          PY
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1 >/dev/null
          kubectl get pods -n customs-regulations-dev -o json > /tmp/simple-search-pods.json
          python - <<'PY'
          import json,subprocess
          pods=json.load(open('/tmp/simple-search-pods.json'))['items']
          inventory=subprocess.run(['kubectl','get','ds,deploy,svc','-A','-o','json'],capture_output=True,text=True)
          if inventory.returncode==0:
              import re
              logging_names=re.compile(r'loki|promtail|fluent|filebeat|grafana|datadog|opentelemetry|cloudwatch|elastic|kibana|vector',re.I)
              for item in json.loads(inventory.stdout).get('items',[]):
                  if logging_names.search(item['metadata']['name']):
                      print('LOGGING_INFRA',json.dumps({'kind':item['kind'],'name':item['metadata']['name'],'namespace':item['metadata']['namespace'],'ports':item.get('spec',{}).get('ports')}))
          for pod in pods:
              name=pod['metadata']['name']
              if 'customs-regulations-api' not in name or pod['status']['phase']!='Running':continue
              containers=[c['name'] for c in pod['spec']['containers'] if 'customs-regulations-backend-lite-dev:' in c['image']]
              for container in containers:
                  result=subprocess.run(['kubectl','logs',name,'-n','customs-regulations-dev','-c',container,'--since=168h'],capture_output=True,text=True)
                  lines=[line for line in result.stdout.splitlines() if 'Catalog simple search request_id=' in line or '[API:nUO-T9g0]' in line]
                  print('CURRENT_POD_SEARCH_LOG',json.dumps({'pod':name,'created':pod['metadata']['creationTimestamp'],'matches':len(lines)}))
                  for line in lines:print('POD_SEARCH_LOG',line)
                  command="find /var/log/onyx -maxdepth 1 -type f -name '*api*' -printf '%f %s bytes\\n' 2>/dev/null"
                  inventory=subprocess.run(['kubectl','exec',name,'-n','customs-regulations-dev','-c',container,'--','sh','-c',command],capture_output=True,text=True)
                  print('POD_LOG_FILES',inventory.stdout[-3000:])
          PY

name: One-time DEV remaining 78 repair
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, launch, refresh_helpers, update_amendment_image, inspect_amendment_runtime, restore_amendment_runtime]
        default: inspect
permissions:
  contents: read
jobs:
  launch:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: ${{ (inputs.operation == 'update_amendment_image' || inputs.operation == 'restore_amendment_runtime') && 15 || 5 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Update DEV amendment image while preserving live resources
        if: (inputs.operation == 'update_amendment_image' || inputs.operation == 'restore_amendment_runtime') && github.ref == 'refs/heads/develop'
        env:
          RESTORE_RUNTIME: ${{ inputs.operation == 'restore_amendment_runtime' && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          namespace = 'customs-regulations-dev'
          deployment = 'dev-customs-regulations-background-deployment'
          container = 'dev-customs-regulations-background-container'
          repository = '255114580789.dkr.ecr.eu-central-1.amazonaws.com/customs-regulations-backend-lite-dev:'
          image = repository + '6f686f078f0e83f3290e06b64d4439acd11ada3f'
          previous_image = repository + '7d5b7cb7851abbcf91331804784edf325dae1f35'

          def kubectl(*args):
              return subprocess.run(['kubectl', '-n', namespace, *args], check=True, text=True, capture_output=True, timeout=660).stdout

          before = json.loads(kubectl('get', 'deployment', deployment, '-o', 'json'))
          containers = before['spec']['template']['spec']['containers']
          matches = [(i, c) for i, c in enumerate(containers) if c['name'] == container]
          assert len(matches) == 1, 'Expected one project container'
          index, current = matches[0]
          resources = current['resources']
          assert resources['limits']['memory'] == '5Gi', 'Expected approved 5Gi limit'
          assert resources['requests']['memory'] == '2560Mi', 'Expected live 2.5Gi request'
          assert current['image'] in (previous_image, image), 'Unexpected live image; inspect before retry'
          print('PRESERVED_RESOURCES', json.dumps(resources), flush=True)
          desired_env = current.get('env', [])
          if os.environ['RESTORE_RUNTIME'] == 'true':
              prior = json.loads(kubectl('get', 'replicaset', deployment + '-7f6b7999d5', '-o', 'json'))
              prior_container = next(c for c in prior['spec']['template']['spec']['containers'] if c['name'] == container)
              assert prior_container['image'] == image, 'Expected previous validated application revision'
              names = {'REGULATORY_ANNEX_ENVIRONMENT', 'REGULATORY_ANNEX_WORKER_ENABLED', 'REDIS_DEPLOYMENT_DATABASES', 'REGULATORY_ANNEX_UPDATES_ENABLED', 'REGULATORY_LABELING_VERTEX_GCS_URI'}
              restored = [e for e in prior_container['env'] if e['name'] in names]
              values = {e['name']:e.get('value') for e in restored}
              assert len(restored) == len(names) and set(values) == names
              assert values['REGULATORY_ANNEX_ENVIRONMENT'] == 'dev'
              assert values['REDIS_DEPLOYMENT_DATABASES'] == '4,5,6'
              assert values['REGULATORY_ANNEX_WORKER_ENABLED'] == 'true'
              assert values['REGULATORY_ANNEX_UPDATES_ENABLED'] == 'true'
              assert values['REGULATORY_LABELING_VERTEX_GCS_URI'].startswith('gs://')
              desired_env = [e for e in desired_env if e['name'] not in names] + restored
              print('RESTORING_DEV_KEYS', sorted(names), flush=True)
          if current['image'] != image or current.get('env', []) != desired_env:
              path = f'/spec/template/spec/containers/{index}'
              patch = [
                  {'op': 'test', 'path': '/metadata/resourceVersion', 'value': before['metadata']['resourceVersion']},
                  {'op': 'test', 'path': path + '/resources', 'value': resources},
                  {'op': 'test', 'path': path + '/image', 'value': current['image']},
                  {'op': 'replace', 'path': path + '/image', 'value': image},
              ]
              if current.get('env', []) != desired_env:
                  patch.append({'op': 'add', 'path': path + '/env', 'value': desired_env})
              print(kubectl('patch', 'deployment', deployment, '--type=json', '-p', json.dumps(patch)), flush=True)
          print(kubectl('rollout', 'status', 'deployment/' + deployment, '--timeout=600s'), flush=True)
          after = json.loads(kubectl('get', 'deployment', deployment, '-o', 'json'))
          updated = next(c for c in after['spec']['template']['spec']['containers'] if c['name'] == container)
          assert updated['image'] == image and updated['resources'] == resources and updated.get('env', []) == desired_env
          pods = json.loads(kubectl('get', 'pods', '-l', 'app=dev-customs-regulations-background', '-o', 'json'))['items']
          ready = [p for p in pods if not p['metadata'].get('deletionTimestamp') and any(c['name'] == container and c['image'] == image for c in p['spec']['containers']) and any(c['name'] == container and c.get('ready') for c in p['status'].get('containerStatuses', []))]
          assert len(ready) == 1, 'Expected one ready updated worker'
          pod = ready[0]['metadata']['name']
          for attempt in range(30):
              try:
                  print(kubectl('exec', pod, '-c', container, '--', 'sh', '-ec', '. /vault/secrets/config; exec python -m onyx.background.celery.regulatory_annex_readiness'), flush=True)
                  break
              except subprocess.CalledProcessError as error:
                  print('READINESS_ATTEMPT', attempt + 1, error.stdout[-500:], flush=True)
                  if attempt == 29:
                      raise
                  time.sleep(5)
          print('VERIFIED_IMAGE', image, 'VERIFIED_RESOURCES', json.dumps(resources), flush=True)
          print(kubectl('exec', pod, '-c', container, '--', 'python', '-c', "from pathlib import Path; print({n:(Path('/sys/fs/cgroup')/n).read_text() for n in ('memory.current','memory.max','memory.events')})"), flush=True)
          PY
      - name: Inspect current DEV amendment worker readiness
        if: inputs.operation == 'inspect_amendment_runtime' && github.ref == 'refs/heads/develop'
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          python3 - <<'PY'
          import json
          import subprocess
          ns = 'customs-regulations-dev'
          container = 'dev-customs-regulations-background-container'
          def run(*args):
              return subprocess.run(['kubectl', '-n', ns, *args], text=True, capture_output=True, timeout=120)
          result = run('get', 'pods', '-l', 'app=dev-customs-regulations-background', '-o', 'json')
          result.check_returncode()
          pods = [p for p in json.loads(result.stdout)['items'] if not p['metadata'].get('deletionTimestamp')]
          assert len(pods) == 1
          p = pods[0]
          c = next(c for c in p['spec']['containers'] if c['name'] == container)
          keys = ('REGULATORY_ANNEX_ENVIRONMENT', 'REGULATORY_ANNEX_WORKER_ENABLED', 'REDIS_DEPLOYMENT_DATABASES', 'POSTGRES_DB', 'POSTGRES_DATABASE')
          print('POD', json.dumps({'name':p['metadata']['name'],'image':c['image'],'resources':c['resources'],'environment':{e['name']:e.get('value','<reference>') for e in c.get('env',[]) if e['name'] in keys},'status':p['status'].get('containerStatuses',[])}), flush=True)
          pod = p['metadata']['name']
          commands = [
              ['supervisorctl','-c','/etc/supervisor/conf.d/supervisord.conf','status','celery_worker_regulatory_annex'],
              ['sh','-ec',". /vault/secrets/config; exec python -c 'import os; print({k:os.environ.get(k) for k in (\"REGULATORY_ANNEX_ENVIRONMENT\",\"REGULATORY_ANNEX_WORKER_ENABLED\",\"REDIS_DEPLOYMENT_DATABASES\",\"POSTGRES_DB\",\"POSTGRES_DATABASE\")})'"],
              ['sh','-ec','. /vault/secrets/config; exec python -m onyx.background.celery.regulatory_annex_readiness'],
          ]
          for command in commands:
              result = run('exec',pod,'-c',container,'--',*command)
              print('CHECK', command[0], 'EXIT', result.returncode, 'OUTPUT', result.stdout[-3000:], flush=True)
          PY
      - name: Inspect or launch the existing DEV project repair
        if: inputs.operation != 'update_amendment_image' && inputs.operation != 'inspect_amendment_runtime' && inputs.operation != 'restore_amendment_runtime'
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          kubectl get pods -n customs-regulations-dev -o json > /tmp/dev-project-pods.json
          python - <<'PY'
          import json
          from pathlib import Path
          candidates=[]
          for pod in json.loads(Path('/tmp/dev-project-pods.json').read_text())['items']:
              for container in pod['spec']['containers']:
                  if 'customs-regulations-backend-lite-dev:' not in container['image']:
                      continue
                  print('PROJECT_RESOURCES',json.dumps({'pod':pod['metadata']['name'],'container':container['name'],'resources':container.get('resources',{}),'image':container['image']}))
                  if pod['status']['phase']=='Running' and not pod['metadata'].get('deletionTimestamp'):
                      candidates.append(pod['metadata']['name']+'\t'+container['name'])
          Path('/tmp/dev-project-backends').write_text('\n'.join(candidates)+'\n')
          PY
          if [[ '${{ inputs.operation }}' == 'inspect' ]]; then
            while IFS=$'\t' read -r resource_pod resource_container; do
              [[ -n "$resource_pod" ]] || continue
              echo "PROJECT_MEMORY $resource_pod $resource_container"
              kubectl exec "$resource_pod" -n customs-regulations-dev -c "$resource_container" -- \
                python -c "from pathlib import Path; print({n:(Path('/sys/fs/cgroup')/n).read_text() for n in ('memory.current','memory.max','cpu.max')})"
            done < /tmp/dev-project-backends
          fi
          kubectl get pods -n customs-regulations-dev -l app=dev-customs-regulations-background -o json > /tmp/remaining78-pods.json
          python - <<'PY'
          import json
          from pathlib import Path
          selected=[]
          for pod in json.loads(Path('/tmp/remaining78-pods.json').read_text())['items']:
              print(json.dumps({'pod':pod['metadata']['name'],'uid':pod['metadata']['uid'],
                  'created':pod['metadata']['creationTimestamp'],'phase':pod['status']['phase'],
                  'containers':[{k:c.get(k) for k in ('name','image','restartCount','lastState','state')} for c in pod['status'].get('containerStatuses',[])]}))
              if pod['metadata'].get('deletionTimestamp') or pod['status']['phase']!='Running':
                  continue
              ready={c['name'] for c in pod['status'].get('containerStatuses',[]) if c.get('ready')}
              for container in pod['spec']['containers']:
                  if container['name'] not in ready or not container['image'].endswith(':7d5b7cb7851abbcf91331804784edf325dae1f35'):
                      continue
                  limits=container.get('resources',{}).get('limits',{})
                  if str(limits.get('cpu')) not in ('1','1000m') or limits.get('memory') not in ('4Gi','4096Mi'):
                      raise SystemExit('Project resource limits differ; refusing launch')
                  selected.append((pod['metadata']['name'],container['name']))
          if len(selected)!=1:
              raise SystemExit('Expected exactly one ready pinned DEV project container')
          Path('/tmp/remaining78-target').write_text('\t'.join(selected[0]))
          PY
          IFS=$'\t' read -r pod container < /tmp/remaining78-target || [[ -n "$pod" && -n "$container" ]]
          directory=/tmp/dev-remaining78-20260924-resume2
          if [[ '${{ inputs.operation }}' == 'refresh_helpers' ]]; then
            incoming="$directory/refresh-bounded-v1"
            tar -C .github/maintenance/remaining78-20260924 -cf - repair_server.py backpressure.py bounded_inventory.py refresh_helpers.py \
              | kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
                  sh -ec 'umask 077; mkdir "$1"; tar -xf - -C "$1"' remaining78-helper-copy "$incoming"
            kubectl exec "$pod" -n customs-regulations-dev -c "$container" -- \
              sh -ec '. /vault/secrets/config; cd /app/onyx/db; exec python "$1/refresh_helpers.py"' remaining78-helper-refresh "$incoming"
            exit 0
          fi
          if [[ '${{ inputs.operation }}' != 'launch' ]]; then
            kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- python - <<'PY'
          import json
          from pathlib import Path
          directory=Path('/tmp/dev-remaining78-20260924-resume2')
          receipt=directory/'launch.json'
          pid=json.loads(receipt.read_text())['pid'] if receipt.exists() else 508
          process=Path('/proc')/str(pid)
          print('HOST_MEMORY', '\n'.join(line for line in Path('/proc/meminfo').read_text().splitlines() if line.split(':')[0] in ('MemTotal','MemAvailable','SwapFree')))
          print('PROCESS_EXISTS',process.exists())
          if process.exists():
              print((process/'cmdline').read_bytes().replace(b'\x00',b' ').decode())
              print((process/'status').read_text())
          for name in ('memory.current','memory.max','memory.events','memory.stat'):
              path=Path('/sys/fs/cgroup')/name
              if path.exists(): print(name,path.read_text())
          for name in ('worker.log','results.jsonl','phase.json','file-2.log','file-3.log','file-4.log'):
              path=directory/name
              print(name, path.stat().st_size if path.exists() else 'absent')
              if path.exists():
                  with path.open('rb') as stream:
                      stream.seek(max(0,path.stat().st_size-16000))
                      print('\n'.join(stream.read().decode(errors='replace').splitlines()[-50:]))
          for process in Path('/proc').glob('[0-9]*'):
              try:
                  command=(process/'cmdline').read_bytes()
                  status=(process/'status').read_text().splitlines()
                  rss=next((int(line.split()[1]) for line in status if line.startswith('VmRSS:')),0)
                  if rss > 100000 or b'/tmp/dev-remaining78-20260924-resume2/' in command:
                      print('PROCESS_MEMORY',process.name,'rss_kib',rss,'name',(process/'comm').read_text().strip())
                      print('\n'.join(line for line in status if line.startswith(('VmRSS:','VmHWM:','VmSwap:','RssAnon:','RssFile:'))))
              except (FileNotFoundError,PermissionError):
                  pass
          PY
            exit 0
          fi
          tar -C .github/maintenance/remaining78-20260924 -cf - repair_server.py image_correction.py image_scope.py backpressure.py bounded_inventory.py file-plan.json launch.py supervisor.py \
            | kubectl exec -i "$pod" -n customs-regulations-dev -c "$container" -- \
                sh -ec 'umask 077; mkdir "$1"; tar -xf - -C "$1"' remaining78-copy "$directory"
          kubectl exec "$pod" -n customs-regulations-dev -c "$container" -- \
            sh -ec '. /vault/secrets/config; export PYTHONPATH=/app; cd /app/onyx/db; exec python "$1/launch.py"' remaining78-launch "$directory"

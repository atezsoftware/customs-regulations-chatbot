name: TEST migration recovery verification
run-name: TEST migration recovery verification ${{ github.run_id }}
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: codebuild-customs-regulations-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify TEST startup, database preservation, and external health
        if: ${{ !inputs.diagnostic }}
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          mkdir -p evidence
          ns=customs-regulations-test
          kubectl get deploy test-v1-customs-regulations-api-deployment -n "$ns" -o json > /tmp/test-api-deployment.json
          python3 - <<'PYIN'
          import json
          d=json.load(open('/tmp/test-api-deployment.json'))
          c=d['spec']['template']['spec']['containers'][0]
          print(json.dumps({'image':c['image'],'command':c.get('command'),'args':c.get('args')}))
          assert c['image'].endswith(':95e4d6aada8a2ea8381f26f4dc2be366971c2671'), 'Normal TEST image is not deployed yet'
          if c.get('command')==['bash','-c'] and c.get('args',[])[:2]==['bash','-c']:
              json.dump({'spec':{'template':{'spec':{'containers':[{'name':c['name'],'command':None}]}}}},open('/tmp/test-command-normalization.json','w'))
              print('Removing the recovery command override now that Helm has restored the original bash arguments')
          PYIN
          if [[ -f /tmp/test-command-normalization.json ]]; then
            kubectl patch deployment test-v1-customs-regulations-api-deployment -n "$ns" --type=strategic --patch-file=/tmp/test-command-normalization.json
          fi
          kubectl rollout status deployment/test-v1-customs-regulations-api-deployment -n "$ns" --timeout=180s
          kubectl rollout status deployment/test-v1-customs-regulations-background-deployment -n "$ns" --timeout=180s
          kubectl get deploy,pods -n "$ns" -o json | jq '[.items[] | {kind,name:.metadata.name,images:[.spec.template.spec.containers[]?.image,.spec.containers[]?.image],ready:.status.readyReplicas,available:.status.availableReplicas,containers:[.status.containerStatuses[]? | {name,ready,restartCount,imageID,state}]}]' > evidence/test-workloads.json
          pod=$(kubectl get pods -n "$ns" -l app=test-v1-customs-regulations-api -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | select(any(.status.containerStatuses[]?; .ready and (.image | contains("backend-lite")))) | .metadata.name' | head -n 1)
          [[ -n "$pod" ]]
          container=$(kubectl get pod "$pod" -n "$ns" -o json | jq -r '.spec.containers[] | select(.image | contains("backend-lite")) | .name' | head -n 1)
          kubectl exec -i "$pod" -n "$ns" -c "$container" -- sh -ec '. /vault/secrets/config; cd /app/onyx/db; python - customs-regulations-test' < backend/onyx/db/test_migration_identity_probe.py > evidence/test-database.json
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/test-database.json'))
          assert d['database']=='customs-regulations-test'
          assert d['db_revisions']==['e92f3a1c7b60']
          assert d['image_version']=='95e4d6aada8a2ea8381f26f4dc2be366971c2671'
          assert all(d['current_revisions_in_image'].values())
          assert d['counts']=={'user':12,'file_record':30234,'regulatory_chunk':565990,'amendment_proposal':39}
          print(json.dumps({'verified':True,'database':d['database'],'revision':d['db_revisions'],'image_version':d['image_version'],'counts':d['counts']}))
          PY
          kubectl logs "$pod" -n "$ns" -c "$container" --tail=300 | sed -n '/run_migrations_online starting/p;/Migrating schema: public/p;/Application startup complete/p;/Uvicorn running on/p' > evidence/api-startup.txt
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 15 https://test-customs-regulations.singlewindow.io/api/health > evidence/frontend-health.json
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/frontend-health.json'))
          assert d['success'] is True
          print('Frontend API health verified: HTTP 200')
          PY
      - name: Capture TEST startup state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name atez-dev-cluster --region eu-central-1
          mkdir -p evidence
          kubectl get deploy,pods -n customs-regulations-test -o json | jq '[.items[] | {kind,name:.metadata.name,images:[.spec.template.spec.containers[]?.image,.spec.containers[]?.image],commands:[.spec.template.spec.containers[]?|{name,command,args}],ready:.status.readyReplicas,available:.status.availableReplicas,containers:[.status.containerStatuses[]? | {name,ready,restartCount,imageID,state,lastState}]}]' | tee evidence/startup-workloads.json
          while IFS=$'\t' read -r pod container; do
            kubectl logs "$pod" -n customs-regulations-test -c "$container" --tail=200 2>&1 | sed -n '/File "/p;/Error:/p;/Exception:/p;/Application startup complete/p;/Uvicorn running on/p;/Can.t locate revision/p;/Running upgrade/p' | sed '/[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]/d;/[Ss][Ee][Cc][Rr][Ee][Tt]/d;/[Tt][Oo][Kk][Ee][Nn]/d' | tee "evidence/$pod-startup.txt" || true
          done < <(kubectl get pods -n customs-regulations-test -l app=test-v1-customs-regulations-api -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .metadata.name as $pod | .spec.containers[] | select(.image | contains("backend-lite")) | [$pod,.name] | @tsv')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-migration-final-verification
          path: evidence/

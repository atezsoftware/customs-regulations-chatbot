services:
  core-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-google/gemini-3.6-flash}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Customs Regulations Chatbot}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-3}
      OPENROUTER_READ_TIMEOUT_SECONDS: ${OPENROUTER_READ_TIMEOUT_SECONDS:-900}
      OPENROUTER_CONNECT_TIMEOUT_SECONDS: ${OPENROUTER_CONNECT_TIMEOUT_SECONDS:-15}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:-}
      FS_EXPLORER_LLM_PROVIDER: ${FS_EXPLORER_LLM_PROVIDER:-openrouter}
      FS_EXPLORER_LLM_MODEL: ${FS_EXPLORER_LLM_MODEL:-google/gemini-3.6-flash}
      FS_EXPLORER_PLANNER_PROVIDER: ${FS_EXPLORER_PLANNER_PROVIDER:-openrouter}
      FS_EXPLORER_PLANNER_MODEL: ${FS_EXPLORER_PLANNER_MODEL:-openai/gpt-5.6-sol}
      FS_EXPLORER_PLANNER_REASONING: ${FS_EXPLORER_PLANNER_REASONING:-medium}
      FS_EXPLORER_TASK_PROVIDER: ${FS_EXPLORER_TASK_PROVIDER:-openrouter}
      FS_EXPLORER_TASK_MODEL: ${FS_EXPLORER_TASK_MODEL:-google/gemini-3.6-flash}
      FS_EXPLORER_TASK_REASONING: ${FS_EXPLORER_TASK_REASONING:-medium}
      FS_EXPLORER_WORKER_PROVIDER: ${FS_EXPLORER_WORKER_PROVIDER:-openrouter}
      FS_EXPLORER_WORKER_MODEL: ${FS_EXPLORER_WORKER_MODEL:-google/gemini-3.5-flash-lite}
      FS_EXPLORER_WORKER_REASONING: ${FS_EXPLORER_WORKER_REASONING:-low}
      FS_EXPLORER_FINAL_PROVIDER: ${FS_EXPLORER_FINAL_PROVIDER:-openrouter}
      FS_EXPLORER_FINAL_MODEL: ${FS_EXPLORER_FINAL_MODEL:-google/gemini-3.6-flash}
      FS_EXPLORER_FINAL_REASONING: ${FS_EXPLORER_FINAL_REASONING:-high}
      FS_EXPLORER_MULTI_AGENT_MAX_FINAL_CONTEXT_CHARS: ${FS_EXPLORER_MULTI_AGENT_MAX_FINAL_CONTEXT_CHARS:-240000}
      FS_EXPLORER_MULTI_AGENT_MAX_PARENT_REPORT_CHARS: ${FS_EXPLORER_MULTI_AGENT_MAX_PARENT_REPORT_CHARS:-120000}
      FS_EXPLORER_MULTI_AGENT_MAX_PROMPT_CHARS: ${FS_EXPLORER_MULTI_AGENT_MAX_PROMPT_CHARS:-400000}
      FS_EXPLORER_MULTI_AGENT_WORKER_HIT_CHARS: ${FS_EXPLORER_MULTI_AGENT_WORKER_HIT_CHARS:-48000}
      FS_EXPLORER_MULTI_AGENT_WORKER_HIT_LIMIT: ${FS_EXPLORER_MULTI_AGENT_WORKER_HIT_LIMIT:-20}
      FS_EXPLORER_MULTI_AGENT_REVIEW_HIT_CHARS: ${FS_EXPLORER_MULTI_AGENT_REVIEW_HIT_CHARS:-64000}
      FS_EXPLORER_MULTI_AGENT_FINAL_EVIDENCE_LIMIT: ${FS_EXPLORER_MULTI_AGENT_FINAL_EVIDENCE_LIMIT:-60}
      FS_EXPLORER_MULTI_AGENT_MAX_CLAIMS_PER_TASK: ${FS_EXPLORER_MULTI_AGENT_MAX_CLAIMS_PER_TASK:-40}
      FS_EXPLORER_MULTI_AGENT_RUN_TOKEN_BUDGET: ${FS_EXPLORER_MULTI_AGENT_RUN_TOKEN_BUDGET:-2000000}
      FS_EXPLORER_MULTI_AGENT_RUN_SECONDS: ${FS_EXPLORER_MULTI_AGENT_RUN_SECONDS:-2700}
      FS_EXPLORER_MULTI_AGENT_LLM_CEILING_SECONDS: ${FS_EXPLORER_MULTI_AGENT_LLM_CEILING_SECONDS:-900}
      FS_EXPLORER_MULTI_AGENT_SEARCH_CEILING_SECONDS: ${FS_EXPLORER_MULTI_AGENT_SEARCH_CEILING_SECONDS:-300}
      FS_EXPLORER_MULTI_AGENT_MAX_COORDINATOR_DECISIONS: ${FS_EXPLORER_MULTI_AGENT_MAX_COORDINATOR_DECISIONS:-3}
    networks:
      - customs_internal

networks:
  customs_internal:
    external: true
    name: customs_internal

services:
  core-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-google/gemini-3.6-flash}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Customs Regulations Chatbot}
      OPENROUTER_REQUEST_TIMEOUT_SECONDS: ${OPENROUTER_REQUEST_TIMEOUT_SECONDS:-90}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-3}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:-}
      FS_EXPLORER_LLM_PROVIDER: ${FS_EXPLORER_LLM_PROVIDER:-openrouter}
      FS_EXPLORER_LLM_MODEL: ${FS_EXPLORER_LLM_MODEL:-google/gemini-3.6-flash}
      FS_EXPLORER_MULTI_AGENT_ENABLED: ${FS_EXPLORER_MULTI_AGENT_ENABLED:-true}
      FS_EXPLORER_PLANNER_PROVIDER: ${FS_EXPLORER_PLANNER_PROVIDER:-openrouter}
      FS_EXPLORER_PLANNER_MODEL: ${FS_EXPLORER_PLANNER_MODEL:-openai/gpt-5.6-sol}
      FS_EXPLORER_PLANNER_REASONING: ${FS_EXPLORER_PLANNER_REASONING:-medium}
      FS_EXPLORER_TASK_PROVIDER: ${FS_EXPLORER_TASK_PROVIDER:-openrouter}
      FS_EXPLORER_TASK_MODEL: ${FS_EXPLORER_TASK_MODEL:-google/gemini-3.6-flash}
      FS_EXPLORER_TASK_REASONING: ${FS_EXPLORER_TASK_REASONING:-medium}
      FS_EXPLORER_WORKER_PROVIDER: ${FS_EXPLORER_WORKER_PROVIDER:-openrouter}
      FS_EXPLORER_WORKER_MODEL: ${FS_EXPLORER_WORKER_MODEL:-google/gemini-3.5-flash-lite}
      FS_EXPLORER_WORKER_REASONING: ${FS_EXPLORER_WORKER_REASONING:-low}
      FS_EXPLORER_FINAL_PROVIDER: ${FS_EXPLORER_FINAL_PROVIDER:-openrouter}
      FS_EXPLORER_FINAL_MODEL: ${FS_EXPLORER_FINAL_MODEL:-google/gemini-3.6-flash}
      FS_EXPLORER_FINAL_REASONING: ${FS_EXPLORER_FINAL_REASONING:-high}
      FS_EXPLORER_MULTI_AGENT_MAX_TASKS: ${FS_EXPLORER_MULTI_AGENT_MAX_TASKS:-5}
      FS_EXPLORER_MULTI_AGENT_MAX_WORKERS_PER_TASK: ${FS_EXPLORER_MULTI_AGENT_MAX_WORKERS_PER_TASK:-3}
      FS_EXPLORER_MULTI_AGENT_MAX_WORKER_ROUNDS: ${FS_EXPLORER_MULTI_AGENT_MAX_WORKER_ROUNDS:-2}
      FS_EXPLORER_MULTI_AGENT_MAX_TOTAL_WORKERS: ${FS_EXPLORER_MULTI_AGENT_MAX_TOTAL_WORKERS:-8}
      FS_EXPLORER_MULTI_AGENT_MAX_LLM_CALLS: ${FS_EXPLORER_MULTI_AGENT_MAX_LLM_CALLS:-24}
      FS_EXPLORER_MULTI_AGENT_MAX_ARTIFACT_ITEMS: ${FS_EXPLORER_MULTI_AGENT_MAX_ARTIFACT_ITEMS:-12}
      FS_EXPLORER_MULTI_AGENT_MAX_ARTIFACT_CONTEXT_CHARS: ${FS_EXPLORER_MULTI_AGENT_MAX_ARTIFACT_CONTEXT_CHARS:-16000}
      FS_EXPLORER_MULTI_AGENT_MAX_QUESTION_CHARS: ${FS_EXPLORER_MULTI_AGENT_MAX_QUESTION_CHARS:-8000}
      FS_EXPLORER_MULTI_AGENT_MAX_PLANNER_CONTEXT_CHARS: ${FS_EXPLORER_MULTI_AGENT_MAX_PLANNER_CONTEXT_CHARS:-16000}
      FS_EXPLORER_MULTI_AGENT_MAX_FINAL_CONTEXT_CHARS: ${FS_EXPLORER_MULTI_AGENT_MAX_FINAL_CONTEXT_CHARS:-48000}
      FS_EXPLORER_MULTI_AGENT_SEARCH_TIMEOUT_SECONDS: ${FS_EXPLORER_MULTI_AGENT_SEARCH_TIMEOUT_SECONDS:-20}
      FS_EXPLORER_MULTI_AGENT_LLM_TIMEOUT_SECONDS: ${FS_EXPLORER_MULTI_AGENT_LLM_TIMEOUT_SECONDS:-120}
    networks:
      - customs_internal

networks:
  customs_internal:
    external: true
    name: customs_internal
